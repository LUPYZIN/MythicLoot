<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looto | Usuários Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --bg-card: #151a26;
            --text: #f3f4f6;
            --text-2: #9ca3af;
            --primary: #6366f1;
            --green: #10b981;
            --red: #ef4444;
            --gold: #fbbf24;
            --orange: #f59e0b;
            --pink: #ec4899;
            --border: rgba(255, 255, 255, 0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }
        
        header {
            background: rgba(11, 14, 20, 0.95);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(16px);
            padding: .9rem 2rem;
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: .5rem;
        }
        .logo { font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--text); text-decoration: none; }
        .logo em { color: var(--red); font-style: normal; }
        .btn-header { background: transparent; border: 1px solid var(--border); color: var(--text-2); padding: .4rem .8rem; border-radius: 6px; font-size: .8rem; cursor: pointer; transition: .3s; text-decoration: none; }
        .btn-header:hover { border-color: var(--red); color: var(--red); }
        
        .main-layout { max-width: 1600px; margin: 0 auto; padding: 1.5rem 2rem; display: grid; grid-template-columns: 220px 1fr; gap: 1.5rem; }
        
        .sidebar { background: var(--bg-card); border-radius: 14px; border: 1px solid var(--border); padding: 1rem; position: sticky; top: 80px; height: fit-content; }
        .sidebar-btn { background: transparent; border: none; color: var(--text-2); padding: .7rem 1rem; border-radius: 8px; font-size: .85rem; cursor: pointer; transition: .3s; text-align: left; display: flex; align-items: center; gap: .5rem; width: 100%; text-decoration: none; }
        .sidebar-btn:hover { background: rgba(255, 255, 255, .03); color: var(--text); }
        .sidebar-btn.active { background: rgba(99, 102, 241, .12); color: var(--primary); font-weight: 600; }
        
        .panel { background: var(--bg-card); border-radius: 14px; border: 1px solid var(--border); padding: 1.5rem; }
        .panel-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: .5rem; }
        
        .search-box { margin-bottom: .8rem; }
        .search-box input { width: 100%; }
        
        .table-container { border: 1px solid var(--border); border-radius: 8px; }
        .table-wrapper { max-height: 600px; overflow-y: auto; }
        .table-wrapper::-webkit-scrollbar { width: 4px; }
        .table-wrapper::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 99px; }
        
        table { width: 100%; border-collapse: collapse; font-size: .82rem; }
        th { text-align: left; padding: .6rem; color: var(--text-2); font-size: .7rem; text-transform: uppercase; border-bottom: 1px solid var(--border); background: var(--bg-card); position: sticky; top: 0; z-index: 1; }
        td { padding: .55rem .6rem; border-bottom: 1px solid rgba(255, 255, 255, .04); }
        
        input, select { background: rgba(11, 14, 20, .6); border: 1px solid var(--border); padding: .5rem .7rem; border-radius: 6px; color: var(--text); font-size: .82rem; outline: none; width: 100%; }
        input:focus, select:focus { border-color: var(--primary); }
        
        .btn-sm { padding: .3rem .6rem; border-radius: 4px; font-size: .7rem; font-weight: 600; cursor: pointer; border: none; transition: .3s; margin: .1rem; }
        .btn-sm.primary { background: var(--primary); color: #fff; }
        .btn-sm.red { background: var(--red); color: #fff; }
        .btn-sm.green { background: var(--green); color: #fff; }
        .btn-sm.orange { background: var(--orange); color: #000; }
        
        .badge { padding: .15rem .5rem; border-radius: 99px; font-size: .7rem; font-weight: 600; display: inline-block; }
        .badge-green { background: rgba(16, 185, 129, .15); color: var(--green); }
        .badge-blue { background: rgba(99, 102, 241, .15); color: var(--primary); }
        .badge-pink { background: rgba(236, 72, 153, .15); color: var(--pink); }
        
        .count-badge { background: rgba(99, 102, 241, .15); color: var(--primary); padding: .1rem .5rem; border-radius: 99px; font-size: .7rem; margin-left: .3rem; }
        
        .toast { position: fixed; top: 1.5rem; right: 1.5rem; background: var(--bg-card); border: 1px solid var(--red); padding: .8rem 1.2rem; border-radius: 12px; font-size: .85rem; z-index: 999; transform: translateX(140%); transition: .3s; max-width: 320px; }
        .toast.show { transform: translateX(0); }
        .toast.ok { border-color: var(--green); }
        
        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 1fr; padding: 1rem; }
            .sidebar { display: flex; flex-wrap: wrap; gap: .3rem; position: static; }
            .sidebar-btn { width: auto; font-size: .7rem; padding: .4rem .6rem; }
        }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>
    
    <header>
        <a href="/looto.html" class="logo"><em>🛡️</em> Looto Admin</a>
        <span id="admin-info" style="font-size:.8rem;color:var(--text-2);"></span>
        <div>
            <a href="/looto.html" class="btn-header">🏠 Site</a>
            <button class="btn-header" onclick="logout()" style="margin-left:.5rem;">🚪 Sair</button>
        </div>
    </header>
    
    <div class="main-layout">
        <aside class="sidebar">
            <a href="admin.html" class="sidebar-btn">📊 Dashboard</a>
            <a href="auser.html" class="sidebar-btn active">👥 Usuários</a>
            <a href="abots.html" class="sidebar-btn">🤖 Bots</a>
            <a href="asorteios.html" class="sidebar-btn">🎁 Sorteios</a>
            <a href="alogsorteios.html" class="sidebar-btn">📋 Log Sorteios</a>
            <a href="achat.html" class="sidebar-btn">💬 Chat</a>
            <a href="agrandesorteio.html" class="sidebar-btn">🏆 Grande Sorteio</a>
            <a href="aloja.html" class="sidebar-btn">🛒 Loja</a>
            <a href="admins.html" class="sidebar-btn">🔑 Admins</a>
            <a href="aferramentas.html" class="sidebar-btn">🔧 Ferramentas</a>
        </aside>
        
        <div class="panel">
            <div class="panel-title">👥 Usuários <span class="count-badge" id="count-usuarios">0</span></div>
            <div class="search-box">
                <input type="text" id="search-usuarios" placeholder="🔍 Buscar por nome, UID, email..." oninput="filtrarUsuarios()">
            </div>
            <div class="table-container">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Tipo</th>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>UID</th>
                                <th>Nível</th>
                                <th>XP</th>
                                <th>💰</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="table-usuarios"></tbody>
                    </table>
                </div>
            </div>
            <div style="text-align:center;padding:.5rem;font-size:.7rem;color:var(--text-2);" id="usuarios-info"></div>
        </div>
    </div>
    
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { getDatabase, ref, get, update, remove } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyDUBFZkXFtIGzE-Mp4WLVWA77HzlaG9pMI",
        authDomain: "looto-f46e5.firebaseapp.com",
        databaseURL: "https://looto-f46e5-default-rtdb.firebaseio.com",
        projectId: "looto-f46e5",
        storageBucket: "looto-f46e5.firebasestorage.app",
        messagingSenderId: "295066400995",
        appId: "1:295066400995:web:cdaa28a808f71e7e6eadd6"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    
    // 100 níveis (mesma lógica do conta.html)
    function gerarNiveis() {
        const ranks = [
            { min:0, max:4, nome:'Bronze', icon:'🥉', cor:'#cd7f32' },
            { min:5, max:9, nome:'Ferro', icon:'⚙️', cor:'#8b8b8b' },
            { min:10, max:14, nome:'Prata', icon:'🪙', cor:'#9ca3af' },
            { min:15, max:19, nome:'Ouro', icon:'🥇', cor:'#f59e0b' },
            { min:20, max:24, nome:'Platina', icon:'🪨', cor:'#a855f7' },
            { min:25, max:29, nome:'Esmeralda', icon:'💚', cor:'#10b981' },
            { min:30, max:34, nome:'Rubi', icon:'❤️', cor:'#ef4444' },
            { min:35, max:39, nome:'Safira', icon:'💙', cor:'#3b82f6' },
            { min:40, max:44, nome:'Épico', icon:'👑', cor:'#fbbf24' },
            { min:45, max:49, nome:'Lendário', icon:'🌟', cor:'#ff8c00' },
            { min:50, max:54, nome:'Mítico', icon:'🔮', cor:'#ec4899' },
            { min:55, max:59, nome:'Celestial', icon:'🌌', cor:'#6366f1' },
            { min:60, max:64, nome:'Transcendente', icon:'⚡', cor:'#d946ef' },
            { min:65, max:69, nome:'Divino', icon:'🕊️', cor:'#ffffff' },
            { min:70, max:74, nome:'Supremo', icon:'💎', cor:'#38bdf8' },
            { min:75, max:79, nome:'Imortal', icon:'🔥', cor:'#f97316' },
            { min:80, max:84, nome:'Cósmico', icon:'🌠', cor:'#14b8a6' },
            { min:85, max:89, nome:'Abissal', icon:'🌊', cor:'#0ea5e9' },
            { min:90, max:94, nome:'Eterno', icon:'⏳', cor:'#eab308' },
            { min:95, max:99, nome:'Looto Master', icon:'🏆', cor:'#22c55e' }
        ];
        const niveis = [];
        for(const r of ranks) {
            for(let i = r.min; i <= r.max; i++) {
                const xpNecessario = Math.floor(100 * Math.pow(1.15, i));
                niveis.push({ nivel: i, nome: r.nome, icon: r.icon, cor: r.cor, xpNecessario });
            }
        }
        return niveis;
    }
    
    const NIVEIS = gerarNiveis();
    
    function getNivelByXP(xp) {
        for(let i = NIVEIS.length - 1; i >= 0; i--) {
            if(xp >= NIVEIS[i].xpNecessario) return NIVEIS[i];
        }
        return NIVEIS[0];
    }
    
    let allUsers = [];
    
    function toast(msg, ok = false) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'toast show' + (ok ? ' ok' : '');
        clearTimeout(toast._t);
        toast._t = setTimeout(() => el.classList.remove('show'), 3000);
    }
    
    window.logout = async () => { await signOut(auth); window.location.href = 'login.html'; };
    
    async function checkAdmin(user) {
        if (!user) return false;
        if (user.email === 'startubez.com@gmail.com') return true;
        const snap = await get(ref(db, 'admins'));
        if (!snap.exists()) return false;
        const admins = snap.val();
        for (let key of Object.keys(admins)) { const a = admins[key]; if (a.uid === user.uid || a.email === user.email) return true; }
        return false;
    }
    
    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        const isAdmin = await checkAdmin(user);
        if (!isAdmin) {
            document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;flex-direction:column;gap:1rem;padding:2rem;"><h1 style="font-family:'Space Grotesk',sans-serif;font-size:3rem;color:#ef4444;">🚫 Acesso Negado</h1><p style="color:#9ca3af;">Você não tem permissão.</p><a href="/looto.html" style="background:#6366f1;color:#fff;padding:.8rem 2rem;border-radius:8px;text-decoration:none;font-weight:600;">Ir para o Site</a></div>`;
            setTimeout(() => window.location.href = '/looto.html', 3000);
            return;
        }
        document.getElementById('admin-info').textContent = `👑 ${user.email}`;
        carregarUsuarios();
    });
    
    async function carregarUsuarios() {
        const snap = await get(ref(db, 'usuarios'));
        allUsers = [];
        if (snap.exists()) {
            const data = snap.val();
            allUsers = Object.entries(data).map(([id, val]) => ({ id, ...val }));
        }
        document.getElementById('count-usuarios').textContent = allUsers.length;
        filtrarUsuarios();
    }
    
    window.filtrarUsuarios = function() {
        const search = (document.getElementById('search-usuarios')?.value || '').toLowerCase();
        const tbody = document.getElementById('table-usuarios');
        const info = document.getElementById('usuarios-info');
        
        let filtered = allUsers;
        if (search) {
            filtered = allUsers.filter(u => 
                (u.username || '').toLowerCase().includes(search) ||
                (u.email || '').toLowerCase().includes(search) ||
                (u.id || '').toLowerCase().includes(search)
            );
        }
        
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:2rem;">Nenhum usuário encontrado</td></tr>';
            info.textContent = search ? `Nenhum resultado para "${search}"` : 'Nenhum usuário cadastrado';
            return;
        }
        
        info.textContent = `Mostrando ${filtered.length} de ${allUsers.length} usuários`;
        
        tbody.innerHTML = filtered.map(u => {
            const tipoBadge = u.isBot ? '<span class="badge badge-blue">🤖 Bot</span>' :
                            u.isFake ? '<span class="badge badge-pink">👤 Fake</span>' :
                            '<span class="badge badge-green">👤 Real</span>';
            const nivel = getNivelByXP(u.pontos || 0);
            return `
            <tr>
                <td>${tipoBadge}</td>
                <td><strong>${u.username || 'Anônimo'}</strong></td>
                <td style="font-size:.7rem;color:var(--text-2);">${u.email || '—'}</td>
                <td style="font-size:.65rem;color:var(--text-2);" title="${u.id}">${u.id?.slice(0, 12)}...</td>
                <td><span class="badge" style="background:${nivel.cor}20;color:${nivel.cor};">${nivel.icon} ${nivel.nome} (${nivel.nivel})</span></td>
                <td><input type="number" value="${u.pontos || 0}" id="xp-${u.id}" style="width:80px;"></td>
                <td><input type="number" value="${u.dinheiro || 0}" id="money-${u.id}" style="width:80px;"></td>
                <td>
                    <button class="btn-sm primary" onclick="salvarUser('${u.id}')">💾</button>
                    <button class="btn-sm green" onclick="promoverUser('${u.id}')">⬆️</button>
                    <button class="btn-sm orange" onclick="rebaixarUser('${u.id}')">⬇️</button>
                    <button class="btn-sm red" onclick="banirUser('${u.id}')">🗑️</button>
                </td>
            </tr>`;
        }).join('');
    };
    
    window.salvarUser = async (uid) => {
        const xpInput = document.getElementById('xp-' + uid);
        const moneyInput = document.getElementById('money-' + uid);
        if (!xpInput || !moneyInput) return toast('❌ Campos não encontrados');
        const xp = parseInt(xpInput.value) || 0;
        const money = parseInt(moneyInput.value) || 0;
        const novoNivel = getNivelByXP(xp).nivel;
        try {
            await update(ref(db, 'usuarios/' + uid), { pontos: xp, dinheiro: money, nivelConta: novoNivel });
            toast('✅ Salvo!', true);
            // Atualiza o array local para refletir a mudança
            const user = allUsers.find(u => u.id === uid);
            if (user) { user.pontos = xp; user.dinheiro = money; user.nivelConta = novoNivel; }
            filtrarUsuarios();
        } catch (e) {
            toast('❌ Erro: ' + e.message);
        }
    };
    
    window.promoverUser = async (uid) => {
        const user = allUsers.find(u => u.id === uid);
        if (!user) return;
        const currentXP = user.pontos || 0;
        // Próximo nível
        const currentLevel = getNivelByXP(currentXP);
        const nextLevelNivel = Math.min(99, currentLevel.nivel + 1);
        const nextLevel = NIVEIS[nextLevelNivel];
        const newXP = nextLevel.xpNecessario;
        await update(ref(db, 'usuarios/' + uid), { pontos: newXP, nivelConta: nextLevelNivel });
        toast(`⬆️ Promovido para ${nextLevel.nome}!`, true);
        carregarUsuarios();
    };
    
    window.rebaixarUser = async (uid) => {
        const user = allUsers.find(u => u.id === uid);
        if (!user) return;
        const currentXP = user.pontos || 0;
        const currentLevel = getNivelByXP(currentXP);
        const prevLevelNivel = Math.max(0, currentLevel.nivel - 1);
        const prevLevel = NIVEIS[prevLevelNivel];
        const newXP = prevLevel.xpNecessario;
        await update(ref(db, 'usuarios/' + uid), { pontos: newXP, nivelConta: prevLevelNivel });
        toast(`⬇️ Rebaixado para ${prevLevel.nome}`, true);
        carregarUsuarios();
    };
    
    window.banirUser = async (uid) => {
        if (!confirm(`Banir ${uid.slice(0, 10)}?`)) return;
        await remove(ref(db, 'usuarios/' + uid));
        await remove(ref(db, 'bots/' + uid));
        toast('Banido! 🚫', true);
        carregarUsuarios();
    };
    </script>
</body>
</html>
