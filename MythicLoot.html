<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MYTHIC BOX - Carrossel Centralizado</title>

<style>
:root{
    --bg:#05070d;
    --card:#111318;
    --primary:#00e0ff;
    --text:#fff;
    --muted:#8e939c;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:system-ui;
    background: radial-gradient(circle at top,#0a0d18,#05070d);
    color:var(--text);
    padding-bottom: 80px;
}

/* HEADER */
header{
    position:fixed;
    top:0;
    width:100%;
    padding:18px;
    text-align:center;
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(255,255,255,0.05);
    z-index:100;
    background: rgba(5,7,13,0.8);
}
.logo{
    font-weight:900;
    letter-spacing:3px;
    background:linear-gradient(90deg,#fff,var(--primary));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* WALLET */
.wallet{
    margin-top:85px;
    display:flex;
    justify-content:center;
}
.wallet-box{
    display:flex;
    gap:10px;
    padding:10px 18px;
    border:1px solid var(--primary);
    border-radius:12px;
    background: rgba(17,19,24,0.5);
    backdrop-filter: blur(4px);
}

/* GRID PADRÃO (DESKTOP) */
.grid{
    padding:20px;
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

/* CARTA BASE */
.box-card{
    width:200px;
    height:300px;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    cursor:pointer;
    transition:.35s;
    box-shadow:0 15px 40px rgba(0,0,0,.6);
    flex-shrink:0;
}
.box-card:hover{
    transform:translateY(-10px) scale(1.04);
    box-shadow:0 25px 50px rgba(0,224,255,.25);
}
.card-bg{
    position:absolute;
    inset:0;
    background-size:cover;
    filter:brightness(.55);
}
.card-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to top,#000 15%,transparent 60%);
}
.card-content{
    position:absolute;
    bottom:0;
    width:100%;
    padding:15px;
    text-align:center;
}
.box-icon{font-size:22px;}
h3{font-size:16px;font-weight:800;}
.rarity{font-size:11px;color:var(--muted);margin:5px 0;}
.price{color:var(--primary);font-weight:800;}

/* MODAL ABERTURA */
#opening{
    display:none;
    position:fixed;
    inset:0;
    background:#05070df2;
    backdrop-filter:blur(20px);
    z-index:200;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
}
.chest{
    font-size:90px;
    transition:0.3s;
}
.shake{
    animation:shake 0.08s infinite;
    filter:drop-shadow(0 0 20px var(--primary));
}
@keyframes shake{
0%{transform:rotate(0)}
50%{transform:rotate(6deg)}
100%{transform:rotate(-6deg)}
}
@keyframes explode{
0%{transform:scale(1)}
100%{transform:scale(2.5);opacity:0}
}
.explode{
    animation:explode .5s forwards;
}
.result{
    display:none;
    perspective:1000px;
}
.result-card{
    width:230px;
    border-radius:16px;
    overflow:hidden;
    transform:rotateY(90deg) scale(.6);
    opacity:0;
    transition:.6s cubic-bezier(.34,1.5,.64,1);
    box-shadow:0 20px 60px rgba(0,0,0,.8);
}
.result-card.show{
    transform:rotateY(0) scale(1);
    opacity:1;
}
.result-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg,transparent,rgba(0,224,255,.5),transparent);
    opacity:0;
}
.result-card.show::before{
    animation:shine 1.2s ease;
}
@keyframes shine{
0%{opacity:0;transform:translateX(-100%)}
50%{opacity:1}
100%{opacity:0;transform:translateX(100%)}
}
.result img{
    width:100%;
    height:300px;
    object-fit:cover;
}
.result h3{
    text-align:center;
    padding:10px;
}
button{
    padding:14px 30px;
    border:none;
    border-radius:12px;
    background:var(--primary);
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}
button:hover{
    transform:scale(1.05);
}

/* MENU COM ANIMAÇÃO HOVER */
nav{
    position:fixed;
    bottom:0;
    width:100%;
    height:70px;
    background:#0a0c12;
    display:flex;
    justify-content:space-around;
    align-items:center;
    border-top:1px solid rgba(255,255,255,0.05);
    z-index:99;
}
.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    color:var(--muted);
    font-size:12px;
    cursor:pointer;
    transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    padding: 6px 12px;
    border-radius: 30px;
}
.nav-item:hover{
    transform: translateY(-4px);
    color: var(--primary);
    text-shadow: 0 0 6px var(--primary);
}
.nav-item:hover svg{
    fill: var(--primary);
    filter: drop-shadow(0 0 4px var(--primary));
    transform: scale(1.1);
}
.nav-item svg{
    width:26px;
    height:26px;
    fill:currentColor;
    transition: all 0.2s;
}
.nav-item.active{
    color:var(--primary);
}

/* ========== CARROSSEL ESTILO NETFLIX (APENAS MOBILE) ========== */
@media (max-width: 768px) {
    .grid {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        gap: 20px;
        padding: 30px 15px;
        scroll-behavior: smooth;
        /* remove barras de scroll mas mantém funcional */
        scrollbar-width: thin;
    }
    .grid::-webkit-scrollbar {
        height: 4px;
    }
    .grid::-webkit-scrollbar-track {
        background: #1a1c24;
        border-radius: 10px;
    }
    .grid::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 10px;
    }

    .grid .box-card {
        scroll-snap-align: center;
        width: 240px;
        min-width: 240px;
        transition: all 0.3s ease;
    }

    /* Efeito de profundidade: o card central fica maior, laterais menores e com opacidade */
    .grid .box-card:not(.active-slide) {
        transform: scale(0.85);
        opacity: 0.6;
        filter: blur(1px);
    }
    .grid .box-card.active-slide {
        transform: scale(1.05);
        opacity: 1;
        filter: blur(0);
        box-shadow: 0 0 25px rgba(0,224,255,0.5);
        z-index: 2;
    }

    /* Botões de navegação customizados (setas) */
    .carousel-controls {
        display: flex;
        justify-content: center;
        gap: 25px;
        margin: 10px 0 20px;
    }
    .carousel-btn {
        background: rgba(0,224,255,0.2);
        backdrop-filter: blur(8px);
        border: 1px solid var(--primary);
        border-radius: 60px;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.2s;
        color: white;
        font-size: 32px;
        font-weight: bold;
    }
    .carousel-btn:hover {
        background: var(--primary);
        transform: scale(1.1);
        box-shadow: 0 0 15px var(--primary);
    }
}

/* No desktop, esconde os controles do carrossel */
@media (min-width: 769px) {
    .carousel-controls {
        display: none;
    }
}
</style>
</head>
<body>

<header>
<div class="logo">MYTHIC BOX</div>
</header>

<div class="wallet">
<div class="wallet-box">
💰 <span id="money">R$ 100,00</span>
</div>
</div>

<div class="grid" id="carouselGrid">
    <div class="box-card" data-price="5" data-name="Caixa Básica">
        <div class="card-bg" style="background-image:url('https://images.igdb.com/igdb/image/upload/t_cover_big/co49ba.png')"></div>
        <div class="card-overlay"></div>
        <div class="card-content">
            <div class="box-icon">🎁</div>
            <h3>Caixa Básica</h3>
            <p class="rarity">Games até R$100</p>
            <div class="price">R$ 5</div>
        </div>
    </div>
    <div class="box-card disabled" data-price="15" data-disabled="true">
        <div class="card-bg" style="background-image:url('https://images.igdb.com/igdb/image/upload/t_cover_big/co2qhe.png')"></div>
        <div class="card-overlay"></div>
        <div class="card-content">
            <h3>Intermediária</h3>
            <p class="rarity">EM BREVE</p>
            <div class="price">R$ 15</div>
        </div>
    </div>
    <div class="box-card disabled" data-price="30" data-disabled="true">
        <div class="card-bg" style="background-image:url('https://images.igdb.com/igdb/image/upload/t_cover_big/co4jni.png')"></div>
        <div class="card-overlay"></div>
        <div class="card-content">
            <h3>Premium</h3>
            <p class="rarity">EM BREVE</p>
            <div class="price">R$ 30</div>
        </div>
    </div>
</div>

<!-- Controles do carrossel (setas) aparecem só no mobile -->
<div class="carousel-controls">
    <div class="carousel-btn" id="prevCarousel">‹</div>
    <div class="carousel-btn" id="nextCarousel">›</div>
</div>

<div id="opening">
    <div class="chest" id="chest">📦</div>
    <button id="spinBtn">GIRAR</button>
    <div class="result" id="result">
        <div class="result-card" id="card">
            <img id="img">
            <h3 id="name"></h3>
        </div>
    </div>
</div>

<nav>
    <div class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/></svg>
        <span>Caixas</span>
    </div>
    <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg>
        <span>Conta</span>
    </div>
    <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 6h-3V4H7v2H4v14h16V6z"/></svg>
        <span>Resgatar</span>
    </div>
</nav>

<script>
// ==================== SONS ====================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playTone(freq, duration, type='sine', volume=0.2){
    try{
        if(!audioCtx) audioCtx = new AudioCtx();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        osc.type = type;
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.start();
        osc.stop(now + duration);
    }catch(e){ console.warn("audio error", e); }
}
function playHover(){ playTone(880, 0.08, 'sine', 0.08); }
function playClick(){ playTone(660, 0.1, 'sine', 0.15); }
function playOpenBox(){ playTone(440, 0.2, 'triangle', 0.2); setTimeout(()=> playTone(550, 0.15, 'sine', 0.2), 100); }
function playSpin(){ playTone(300, 0.1, 'sawtooth', 0.1); setTimeout(()=> playTone(350, 0.1, 'sawtooth', 0.1), 100); setTimeout(()=> playTone(400, 0.1, 'sawtooth', 0.1), 200); }
function playWin(){ playTone(523.25, 0.2, 'sine', 0.3); setTimeout(()=> playTone(659.25, 0.2, 'sine', 0.3), 150); setTimeout(()=> playTone(783.99, 0.4, 'sine', 0.3), 300); }

// ==================== LÓGICA PRINCIPAL ====================
let saldo = 100;
const items = [
    {name:"Cyberpunk 2077", img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1r7h.png"},
    {name:"Elden Ring", img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co4jni.png"},
    {name:"GTA V", img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1w2s.png"},
    {name:"Hades", img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1z5c.png"},
    {name:"The Witcher 3", img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1q8d.png"}
];

function updateMoney(){
    document.getElementById("money").innerText="R$ "+saldo.toFixed(2).replace(".",",");
}

function openBox(price){
    if(saldo<price){
        alert("Saldo insuficiente");
        return;
    }
    playOpenBox();
    document.getElementById("opening").style.display="flex";
    document.getElementById("spinBtn").onclick=()=>spin(price);
}

function spin(price){
    const chest=document.getElementById("chest");
    const btn=document.getElementById("spinBtn");
    saldo-=price;
    updateMoney();
    btn.style.display="none";
    chest.classList.add("shake");
    playSpin();
    
    setTimeout(()=>{
        chest.classList.remove("shake");
        chest.classList.add("explode");
        playWin();
        setTimeout(()=>{
            chest.style.display="none";
            const item=items[Math.floor(Math.random()*items.length)];
            document.getElementById("img").src=item.img;
            document.getElementById("name").innerText=item.name;
            document.getElementById("result").style.display="block";
            setTimeout(()=>{
                document.getElementById("card").classList.add("show");
            },50);
            setTimeout(()=>{
                document.getElementById("opening").style.display="none";
                document.getElementById("result").style.display="none";
                document.getElementById("card").classList.remove("show");
                chest.style.display="block";
                chest.classList.remove("explode");
                btn.style.display="block";
            },3500);
        },400);
    },2000);
}

// Clique nas caixas
document.querySelectorAll('.box-card').forEach(card => {
    card.addEventListener('click', function(e) {
        e.stopPropagation();
        if(this.classList.contains('disabled')) {
            alert("🔒 Caixa em breve!");
            return;
        }
        playClick();
        const price = parseFloat(this.dataset.price);
        if(!isNaN(price)) openBox(price);
    });
});

// ==================== CARROSSEL MOBILE ESTILO NETFLIX ====================
function initMobileCarousel() {
    const isMobile = window.innerWidth <= 768;
    if(!isMobile) return;

    const container = document.getElementById('carouselGrid');
    const cards = Array.from(document.querySelectorAll('.box-card'));
    if(cards.length === 0) return;

    // Função para atualizar a classe "active-slide" baseada no centro da tela
    function updateActiveSlide() {
        const containerRect = container.getBoundingClientRect();
        const centerX = containerRect.left + containerRect.width / 2;
        let closestCard = null;
        let closestDistance = Infinity;
        
        cards.forEach(card => {
            const rect = card.getBoundingClientRect();
            const cardCenterX = rect.left + rect.width / 2;
            const distance = Math.abs(cardCenterX - centerX);
            if(distance < closestDistance) {
                closestDistance = distance;
                closestCard = card;
            }
        });
        
        cards.forEach(card => card.classList.remove('active-slide'));
        if(closestCard) closestCard.classList.add('active-slide');
    }
    
    // Scroll suave para o card ao clicar nas setas
    function scrollToCard(index) {
        if(index < 0) index = 0;
        if(index >= cards.length) index = cards.length-1;
        const card = cards[index];
        if(card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            setTimeout(updateActiveSlide, 300);
        }
    }
    
    // Navegação por setas
    let currentIdx = 0;
    const updateCurrentIndex = () => {
        const containerRect = container.getBoundingClientRect();
        const centerX = containerRect.left + containerRect.width / 2;
        let bestIdx = 0;
        let bestDist = Infinity;
        cards.forEach((card, idx) => {
            const rect = card.getBoundingClientRect();
            const dist = Math.abs(rect.left + rect.width/2 - centerX);
            if(dist < bestDist) {
                bestDist = dist;
                bestIdx = idx;
            }
        });
        currentIdx = bestIdx;
    };
    
    document.getElementById('prevCarousel').addEventListener('click', () => {
        playClick();
        updateCurrentIndex();
        scrollToCard(currentIdx - 1);
    });
    document.getElementById('nextCarousel').addEventListener('click', () => {
        playClick();
        updateCurrentIndex();
        scrollToCard(currentIdx + 1);
    });
    
    // Atualiza ao rolar ou redimensionar
    container.addEventListener('scroll', () => {
        requestAnimationFrame(updateActiveSlide);
    });
    window.addEventListener('resize', () => {
        updateActiveSlide();
    });
    updateActiveSlide();
}

// Ativar carrossel e áudio
document.body.addEventListener('click', () => {
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

window.addEventListener('load', () => {
    initMobileCarousel();
    updateMoney();
});

// Menu hover com som
document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('mouseenter', playHover);
    item.addEventListener('click', (e) => {
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        item.classList.add('active');
        const tab = item.querySelector('span').innerText.toLowerCase();
        if(tab === 'conta') alert("👤 Área da conta em desenvolvimento! Saldo: R$"+saldo.toFixed(2));
        else if(tab === 'resgatar') alert("🎮 Resgate em breve!");
    });
});
</script>
</body>
</html>
