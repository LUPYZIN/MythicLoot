<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>MYTHIC BOX — Grid Responsivo</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #0a0c12;
    --surface: #14161f;
    --surface-light: #1e202b;
    --primary: #3b82f6;
    --primary-soft: #60a5fa;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #2d2f3e;
    --card-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.5);
}

body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 100px;
}

/* Header */
header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: rgba(10, 12, 18, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    z-index: 100;
    padding: 14px 24px;
}

.header-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.3px;
    background: linear-gradient(110deg, #fff, var(--primary-soft));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.header-icons {
    display: flex;
    gap: 12px;
}

.icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
    border: 1px solid var(--border);
}

.icon-btn svg {
    width: 18px;
    height: 18px;
    fill: var(--text-muted);
}

.icon-btn:hover {
    background: var(--surface-light);
    border-color: var(--primary-soft);
}

/* Wallet */
.wallet {
    display: flex;
    justify-content: center;
    margin-top: 100px;
    margin-bottom: 40px;
}

.wallet-box {
    background: var(--surface);
    border-radius: 40px;
    border: 1px solid var(--border);
    padding: 10px 28px;
    font-weight: 500;
    font-size: 1.1rem;
    color: var(--text);
    backdrop-filter: blur(4px);
}

.wallet-box span {
    color: var(--primary);
    font-weight: 600;
    margin-left: 6px;
}

/* Grid de caixas — responsivo, sem alterar o card */
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
}

.cards-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
    justify-items: center;
    align-items: center;
}

/* Cards — mantendo o DESIGN ORIGINAL (retrato, imagem, overlay, etc) */
.box-card {
    width: 260px;
    height: 350px;
    border-radius: 28px;
    background: var(--surface);
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: all 0.25s ease;
    border: 1px solid var(--border);
    box-shadow: var(--card-shadow);
}

.box-card:hover {
    transform: translateY(-6px);
    border-color: var(--primary);
    box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.5);
}

.card-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: brightness(0.6);
    transition: 0.3s;
}

.box-card:hover .card-bg {
    filter: brightness(0.75);
}

.card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 10%, rgba(0,0,0,0.2) 60%);
}

.card-content {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 20px;
    text-align: center;
    z-index: 2;
}

.box-icon {
    font-size: 32px;
    margin-bottom: 6px;
}

.card-content h3 {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 4px;
}

.rarity {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin: 6px 0;
}

.price {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--primary-soft);
}

/* Menu inferior */
nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10, 12, 18, 0.9);
    backdrop-filter: blur(16px);
    border-radius: 60px;
    border: 1px solid var(--border);
    padding: 6px 16px;
    display: flex;
    gap: 4px;
    z-index: 100;
}

.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 24px;
    border-radius: 50px;
    cursor: pointer;
    transition: 0.2s;
    color: var(--text-muted);
}

.nav-item svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
}

.nav-item span {
    font-size: 12px;
    font-weight: 500;
}

.nav-item:hover {
    background: var(--surface);
    color: var(--primary);
}

.nav-item.active {
    background: var(--surface);
    color: var(--primary);
}

/* Modal */
#opening {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(10px);
    z-index: 200;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
}

.chest {
    font-size: 100px;
    transition: 0.2s;
}

.shake {
    animation: shakeIt 0.08s infinite;
}

@keyframes shakeIt {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(5deg); }
    100% { transform: rotate(-5deg); }
}

.explode {
    animation: explodeAnim 0.45s forwards;
}

@keyframes explodeAnim {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(2); opacity: 0; }
}

.result {
    display: none;
    perspective: 800px;
}

.result-card {
    width: 260px;
    border-radius: 28px;
    overflow: hidden;
    background: var(--surface);
    transform: rotateY(90deg) scale(0.8);
    opacity: 0;
    transition: 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    border: 1px solid var(--border);
}

.result-card.show {
    transform: rotateY(0) scale(1);
    opacity: 1;
}

.result img {
    width: 100%;
    height: 320px;
    object-fit: cover;
}

.result h3 {
    padding: 18px;
    text-align: center;
    font-weight: 600;
    background: var(--surface-light);
    font-size: 1.1rem;
}

button {
    background: var(--primary);
    border: none;
    padding: 12px 32px;
    border-radius: 60px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.2s;
    color: white;
}

button:hover {
    background: var(--primary-soft);
    transform: scale(1.02);
}

.disabled {
    cursor: not-allowed;
    opacity: 0.65;
    filter: grayscale(0.2);
}

.disabled .price {
    color: #6c757d;
}

/* Responsivo: mobile com 2 colunas */
@media (max-width: 860px) {
    .cards-grid {
        gap: 24px;
    }
    .box-card {
        width: 220px;
        height: 300px;
    }
}

@media (max-width: 720px) {
    .cards-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }
    .box-card {
        width: 100%;
        max-width: 260px;
        height: auto;
        aspect-ratio: 260 / 350;
    }
    .container {
        padding: 0 16px;
    }
    .wallet {
        margin-top: 90px;
    }
}

@media (max-width: 480px) {
    .box-card {
        max-width: 100%;
    }
    .card-content h3 {
        font-size: 1rem;
    }
    .price {
        font-size: 1.1rem;
    }
    .box-icon {
        font-size: 28px;
    }
    .nav-item {
        padding: 6px 16px;
    }
    .nav-item span {
        font-size: 10px;
    }
}
</style>
</head>
<body>

<header>
    <div class="header-content">
        <div class="logo">MYTHIC BOX</div>
        <div class="header-icons">
            <div class="icon-btn">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            </div>
        </div>
    </div>
</header>

<div class="wallet">
    <div class="wallet-box">
        💰 Saldo <span id="money">R$ 100,00</span>
    </div>
</div>

<div class="container">
    <div class="cards-grid" id="cardsGrid">
        <!-- Caixa 1 -->
        <div class="box-card" data-price="5">
            <div class="card-bg" style="background-image:url('https://images.igdb.com/igdb/image/upload/t_cover_big/co49ba.png')"></div>
            <div class="card-overlay"></div>
            <div class="card-content">
                <div class="box-icon">🎁</div>
                <h3>Caixa Básica</h3>
                <p class="rarity">Até R$100</p>
                <div class="price">R$ 5</div>
            </div>
        </div>
        <!-- Caixa 2 -->
        <div class="box-card disabled" data-price="15">
            <div class="card-bg" style="background-image:url('https://images.igdb.com/igdb/image/upload/t_cover_big/co2qhe.png')"></div>
            <div class="card-overlay"></div>
            <div class="card-content">
                <div class="box-icon">✨</div>
                <h3>Intermediária</h3>
                <p class="rarity">EM BREVE</p>
                <div class="price">R$ 15</div>
            </div>
        </div>
        <!-- Caixa 3 -->
        <div class="box-card disabled" data-price="30">
            <div class="card-bg" style="background-image:url('https://images.igdb.com/igdb/image/upload/t_cover_big/co4jni.png')"></div>
            <div class="card-overlay"></div>
            <div class="card-content">
                <div class="box-icon">💎</div>
                <h3>Premium</h3>
                <p class="rarity">EM BREVE</p>
                <div class="price">R$ 30</div>
            </div>
        </div>
    </div>
</div>

<nav>
    <div class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/></svg>
        <span>Caixas</span>
    </div>
    <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg>
        <span>Conta</span>
    </div>
    <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 6h-3V4H7v2H4v14h16V6z"/></svg>
        <span>Resgatar</span>
    </div>
</nav>

<div id="opening">
    <div class="chest" id="chest">📦</div>
    <button id="spinBtn">ABRIR</button>
    <div class="result" id="result">
        <div class="result-card" id="card">
            <img id="img" alt="cover">
            <h3 id="name"></h3>
        </div>
    </div>
</div>

<script>
// Áudio simples
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function playTone(freq, duration, type='sine', vol=0.15) {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') return;
    try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        osc.type = type;
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.start();
        osc.stop(now + duration);
    } catch(e) {}
}
function playClick() { playTone(660, 0.08, 'sine', 0.1); }
function playOpen() { playTone(440, 0.18, 'triangle', 0.12); setTimeout(()=> playTone(560, 0.12, 'sine', 0.1), 100); }
function playSpin() { playTone(320, 0.08, 'sawtooth', 0.08); setTimeout(()=> playTone(380, 0.08, 'sawtooth', 0.08), 100); }
function playWin() { playTone(523, 0.2, 'sine', 0.2); setTimeout(()=> playTone(659, 0.2, 'sine', 0.2), 140); }

// Sistema de caixas
let balance = 100;
const prizeList = [
    { name: 'Cyberpunk 2077', img: 'https://images.igdb.com/igdb/image/upload/t_cover_big/co1r7h.png' },
    { name: 'Elden Ring', img: 'https://images.igdb.com/igdb/image/upload/t_cover_big/co4jni.png' },
    { name: 'GTA V', img: 'https://images.igdb.com/igdb/image/upload/t_cover_big/co1w2s.png' },
    { name: 'Hades', img: 'https://images.igdb.com/igdb/image/upload/t_cover_big/co1z5c.png' },
    { name: 'The Witcher 3', img: 'https://images.igdb.com/igdb/image/upload/t_cover_big/co1q8d.png' }
];

function updateBalanceUI() {
    document.getElementById('money').innerText = 'R$ ' + balance.toFixed(2).replace('.', ',');
}

function openBox(price) {
    if (balance < price) { alert('Saldo insuficiente'); return; }
    playOpen();
    document.getElementById('opening').style.display = 'flex';
    document.getElementById('spinBtn').onclick = () => spin(price);
}

function spin(price) {
    const chest = document.getElementById('chest');
    const btn = document.getElementById('spinBtn');
    balance -= price;
    updateBalanceUI();
    btn.style.display = 'none';
    chest.classList.add('shake');
    playSpin();

    setTimeout(() => {
        chest.classList.remove('shake');
        chest.classList.add('explode');
        playWin();
        setTimeout(() => {
            chest.style.display = 'none';
            const prize = prizeList[Math.floor(Math.random() * prizeList.length)];
            document.getElementById('img').src = prize.img;
            document.getElementById('name').innerHTML = prize.name + '<span style="display:block;font-size:0.8rem;margin-top:6px;color:#94a3b8;">Você ganhou!</span>';
            document.getElementById('result').style.display = 'block';
            setTimeout(() => document.getElementById('card').classList.add('show'), 40);
            setTimeout(() => {
                document.getElementById('opening').style.display = 'none';
                document.getElementById('result').style.display = 'none';
                document.getElementById('card').classList.remove('show');
                chest.style.display = 'block';
                chest.classList.remove('explode');
                btn.style.display = 'block';
            }, 3200);
        }, 380);
    }, 1600);
}

// Clique nas caixas
const cards = document.querySelectorAll('.box-card');
cards.forEach(card => {
    card.addEventListener('click', () => {
        if (card.classList.contains('disabled')) { alert('🔒 Em breve'); return; }
        playClick();
        const price = parseFloat(card.dataset.price);
        if (!isNaN(price)) openBox(price);
    });
});

// Menu inferior
document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        item.classList.add('active');
        const label = item.querySelector('span').innerText.toLowerCase();
        if (label === 'conta') alert(`👤 Saldo atual: R$ ${balance.toFixed(2)}`);
        else if (label === 'resgatar') alert('🎮 Em breve você poderá resgatar.');
    });
});

// Ativar áudio no primeiro toque
document.body.addEventListener('click', () => {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

updateBalanceUI();
</script>
</body>
</html>
