<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>MYTHIC BOX</title>

<style>
:root{
    --bg:#05070d;
    --card:#111318;
    --primary:#00e0ff;
    --text:#fff;
    --muted:#8e939c;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:system-ui;
    background: radial-gradient(circle at top,#0a0d18,#05070d);
    color:var(--text);
    padding-bottom: 80px; /* ← EVITA QUE O MENU SOBREPONHA O CONTEÚDO */
}

/* HEADER - continua igual, mas com z-index correto */
header{
    position:fixed;
    top:0;
    width:100%;
    padding:18px;
    text-align:center;
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(255,255,255,0.05);
    z-index: 100;
    background: rgba(5,7,13,0.7);
}
.logo{
    font-weight:900;
    letter-spacing:3px;
    background:linear-gradient(90deg,#fff,var(--primary));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* WALLET - margem ajustada para não ficar atrás do header */
.wallet{
    margin-top:85px;
    display:flex;
    justify-content:center;
}
.wallet-box{
    display:flex;
    gap:10px;
    padding:10px 18px;
    border:1px solid var(--primary);
    border-radius:12px;
    background: rgba(17,19,24,0.5);
    backdrop-filter: blur(4px);
}

/* GRID - DESKTOP: EXATAMENTE O ORIGINAL */
.grid{
    padding:20px;
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

/* CARTA - MESMO ESTILO BASE */
.box-card{
    width:200px;
    height:300px;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    cursor:pointer;
    transition:.35s;
    box-shadow:0 15px 40px rgba(0,0,0,.6);
}
.box-card:hover{
    transform:translateY(-10px) scale(1.04);
    box-shadow:0 25px 50px rgba(0,224,255,.25);
}

.card-bg{
    position:absolute;
    inset:0;
    background-size:cover;
    filter:brightness(.55);
}

.card-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to top,#000 15%,transparent 60%);
}

.card-content{
    position:absolute;
    bottom:0;
    width:100%;
    padding:15px;
    text-align:center;
}

.box-icon{font-size:22px;}
h3{font-size:16px;font-weight:800;}
.rarity{font-size:11px;color:var(--muted);margin:5px 0;}
.price{color:var(--primary);font-weight:800;}

/* ===== OPENING MODAL (igual) ===== */
#opening{
    display:none;
    position:fixed;
    inset:0;
    background:#05070df2;
    backdrop-filter:blur(20px);
    z-index:200;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
}

.chest{
    font-size:90px;
    transition:0.3s;
}
.shake{
    animation:shake 0.08s infinite;
    filter:drop-shadow(0 0 20px var(--primary));
}

@keyframes shake{
0%{transform:rotate(0)}
50%{transform:rotate(6deg)}
100%{transform:rotate(-6deg)}
}

@keyframes explode{
0%{transform:scale(1)}
100%{transform:scale(2.5);opacity:0}
}
.explode{
    animation:explode .5s forwards;
}

.result{
    display:none;
    perspective:1000px;
}

.result-card{
    width:230px;
    border-radius:16px;
    overflow:hidden;
    transform:rotateY(90deg) scale(.6);
    opacity:0;
    transition:.6s cubic-bezier(.34,1.5,.64,1);
    box-shadow:0 20px 60px rgba(0,0,0,.8);
}
.result-card.show{
    transform:rotateY(0) scale(1);
    opacity:1;
}

.result-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg,transparent,rgba(0,224,255,.5),transparent);
    opacity:0;
}
.result-card.show::before{
    animation:shine 1.2s ease;
}
@keyframes shine{
0%{opacity:0;transform:translateX(-100%)}
50%{opacity:1}
100%{opacity:0;transform:translateX(100%)}
}

.result img{
    width:100%;
    height:300px;
    object-fit:cover;
}

.result h3{
    text-align:center;
    padding:10px;
}

button{
    padding:14px 30px;
    border:none;
    border-radius:12px;
    background:var(--primary);
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}
button:hover{
    transform:scale(1.05);
}

/* MENU INFERIOR - com animação hover */
nav{
    position:fixed;
    bottom:0;
    width:100%;
    height:70px;
    background:#0a0c12;
    display:flex;
    justify-content:space-around;
    align-items:center;
    border-top:1px solid rgba(255,255,255,0.05);
    z-index: 99;
}
.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    color:var(--muted);
    font-size:12px;
    cursor: pointer;
    transition: all 0.2s ease;
    padding: 6px 12px;
    border-radius: 30px;
}
/* ANIMAÇÃO HOVER NO MENU */
.nav-item:hover {
    transform: translateY(-4px);
    color: var(--primary);
    text-shadow: 0 0 6px var(--primary);
}
.nav-item:hover svg {
    fill: var(--primary);
    filter: drop-shadow(0 0 4px var(--primary));
    transform: scale(1.08);
}
.nav-item svg{
    width:26px;
    height:26px;
    fill:currentColor;
    transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
}
.nav-item.active{
    color:var(--primary);
}

/* ========== CARROSSEL 3D APENAS NO CELULAR ========== */
@media (max-width: 768px) {
    /* Transforma o grid em container de carrossel */
    .grid {
        display: block;
        overflow-x: auto;
        overflow-y: visible;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
        white-space: nowrap;
        padding: 30px 20px;
        margin: 0;
        gap: 0;
    }
    
    /* Cada caixa vira slide horizontal */
    .grid .box-card {
        display: inline-block;
        vertical-align: middle;
        scroll-snap-align: center;
        margin-right: 15px;
        transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.2);
        transform-origin: center;
        white-space: normal;
    }
    
    /* Efeito 3D: caixa central fica maior, laterais menores e com blur */
    .grid .box-card:not(:first-child):not(:last-child) {
        /* padrão, mas controle via JS para ativar apenas a central */
    }
    
    /* Ocultar scrollbar mas manter funcional */
    .grid::-webkit-scrollbar {
        height: 4px;
    }
    .grid::-webkit-scrollbar-track {
        background: #1a1c24;
        border-radius: 10px;
    }
    .grid::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 10px;
    }
}

/* Para telas muito pequenas, ajusta tamanho do card no carrossel */
@media (max-width: 480px) {
    .grid .box-card {
        width: 180px;
        height: 270px;
    }
}
</style>
</head>

<body>

<header>
<div class="logo">MYTHIC BOX</div>
</header>

<div class="wallet">
<div class="wallet-box">
💰 <span id="money">R$ 100,00</span>
</div>
</div>

<div class="grid" id="carouselGrid">

<div class="box-card" data-price="5" data-name="Caixa Básica" data-rarity="Games até R$100">
<div class="card-bg" style="background-image:url('https://images.igdb.com/igdb/image/upload/t_cover_big/co49ba.png')"></div>
<div class="card-overlay"></div>
<div class="card-content">
<div class="box-icon">🎁</div>
<h3>Caixa Básica</h3>
<p class="rarity">Games até R$100</p>
<div class="price">R$ 5</div>
</div>
</div>

<div class="box-card disabled" data-price="15" data-disabled="true">
<div class="card-bg" style="background-image:url('https://images.igdb.com/igdb/image/upload/t_cover_big/co2qhe.png')"></div>
<div class="card-overlay"></div>
<div class="card-content">
<h3>Intermediária</h3>
<p class="rarity">EM BREVE</p>
<div class="price">R$ 15</div>
</div>
</div>

<div class="box-card disabled" data-price="30" data-disabled="true">
<div class="card-bg" style="background-image:url('https://images.igdb.com/igdb/image/upload/t_cover_big/co4jni.png')"></div>
<div class="card-overlay"></div>
<div class="card-content">
<h3>Premium</h3>
<p class="rarity">EM BREVE</p>
<div class="price">R$ 30</div>
</div>
</div>

</div>

<!-- OPEN MODAL (igual) -->
<div id="opening">
<div class="chest" id="chest">📦</div>
<button id="spinBtn">GIRAR</button>
<div class="result" id="result">
<div class="result-card" id="card">
<img id="img">
<h3 id="name"></h3>
</div>
</div>
</div>

<nav>
<div class="nav-item active">
<svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/></svg>
<span>Caixas</span>
</div>
<div class="nav-item">
<svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg>
<span>Conta</span>
</div>
<div class="nav-item">
<svg viewBox="0 0 24 24"><path d="M20 6h-3V4H7v2H4v14h16V6z"/></svg>
<span>Resgatar</span>
</div>
</nav>

<script>
let saldo = 100;
const items = [
    {name:"Cyberpunk 2077", img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1r7h.png"},
    {name:"Elden Ring", img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co4jni.png"},
    {name:"GTA V", img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1w2s.png"},
    {name:"Hades", img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1z5c.png"},
    {name:"The Witcher 3", img:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1q8d.png"}
];

function updateMoney(){
    document.getElementById("money").innerText="R$ "+saldo.toFixed(2).replace(".",",");
}

function openBox(price){
    if(saldo<price){alert("Saldo insuficiente");return;}
    document.getElementById("opening").style.display="flex";
    document.getElementById("spinBtn").onclick=()=>spin(price);
}

function spin(price){
    const chest=document.getElementById("chest");
    const btn=document.getElementById("spinBtn");
    saldo-=price;
    updateMoney();
    btn.style.display="none";
    chest.classList.add("shake");
    setTimeout(()=>{
        chest.classList.remove("shake");
        chest.classList.add("explode");
        setTimeout(()=>{
            chest.style.display="none";
            const item=items[Math.floor(Math.random()*items.length)];
            document.getElementById("img").src=item.img;
            document.getElementById("name").innerText=item.name;
            document.getElementById("result").style.display="block";
            setTimeout(()=>{
                document.getElementById("card").classList.add("show");
            },50);
            setTimeout(()=>{
                document.getElementById("opening").style.display="none";
                document.getElementById("result").style.display="none";
                document.getElementById("card").classList.remove("show");
                chest.style.display="block";
                chest.classList.remove("explode");
                btn.style.display="block";
            },3500);
        },400);
    },2000);
}

// Associar clique às caixas (original já tem onclick, mas vamos garantir que funcione no carrossel)
document.querySelectorAll('.box-card').forEach(card => {
    card.addEventListener('click', function(e) {
        e.stopPropagation();
        if(this.classList.contains('disabled')) {
            alert("🔒 Caixa em breve!");
            return;
        }
        const price = parseFloat(this.dataset.price);
        if(!isNaN(price)) openBox(price);
    });
});

// ========== EFEITO 3D NO CARROSSEL (SOMENTE MOBILE) ==========
function apply3DCarouselEffect() {
    const isMobile = window.innerWidth <= 768;
    const container = document.getElementById('carouselGrid');
    const cards = Array.from(document.querySelectorAll('.box-card'));
    
    if(!isMobile) {
        // Remove qualquer transform inline no desktop
        cards.forEach(card => {
            card.style.transform = '';
            card.style.opacity = '';
            card.style.filter = '';
            card.style.zIndex = '';
        });
        return;
    }
    
    // Função que atualiza escala/opacidade baseado na posição do scroll
    function updateCarouselDepth() {
        const containerRect = container.getBoundingClientRect();
        const centerX = containerRect.left + containerRect.width / 2;
        
        cards.forEach(card => {
            const rect = card.getBoundingClientRect();
            const cardCenterX = rect.left + rect.width / 2;
            const distanceFromCenter = Math.abs(cardCenterX - centerX);
            const maxDistance = containerRect.width / 2;
            let scale = 1;
            let opacity = 1;
            let blur = 0;
            let zIndex = 1;
            
            if(distanceFromCenter < maxDistance) {
                // Quanto mais perto do centro, maior e mais nítido
                const factor = 1 - (distanceFromCenter / maxDistance);
                scale = 0.85 + (factor * 0.2); // entre 0.85 e 1.05
                opacity = 0.7 + (factor * 0.3);
                blur = (1 - factor) * 2;
                zIndex = Math.floor(factor * 10);
            } else {
                scale = 0.75;
                opacity = 0.5;
                blur = 3;
                zIndex = 0;
            }
            
            card.style.transform = `scale(${scale}) translateY(${(1-scale)*20}px)`;
            card.style.opacity = opacity;
            card.style.filter = `blur(${blur}px)`;
            card.style.zIndex = zIndex;
            card.style.transition = 'all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.2)';
        });
    }
    
    // Aplica ao rolar, ao redimensionar e ao carregar
    container.addEventListener('scroll', updateCarouselDepth);
    window.addEventListener('resize', () => {
        if(window.innerWidth <= 768) updateCarouselDepth();
        else {
            cards.forEach(c => {
                c.style.transform = '';
                c.style.opacity = '';
                c.style.filter = '';
            });
        }
    });
    updateCarouselDepth();
}

// Inicializa o efeito 3D no carrossel
window.addEventListener('load', () => {
    apply3DCarouselEffect();
    // Força snap central ao carregar se for mobile
    if(window.innerWidth <= 768) {
        const container = document.getElementById('carouselGrid');
        const firstCard = document.querySelector('.box-card');
        if(firstCard) {
            setTimeout(() => {
                firstCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }, 100);
        }
    }
});

updateMoney();
</script>

</body>
</html>
