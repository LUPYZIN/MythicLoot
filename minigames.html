<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Looto | Minigames</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --bg-card: #151a26;
            --text: #f3f4f6;
            --text-2: #9ca3af;
            --primary: #6366f1;
            --primary-h: #4f46e5;
            --green: #10b981;
            --gold: #fbbf24;
            --pink: #ec4899;
            --orange: #f59e0b;
            --red: #ef4444;
            --border: rgba(255,255,255,0.06);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --nav-bg: rgba(11, 14, 20, 0.95);
            --nav-border: rgba(255, 255, 255, 0.06);
            --nav-text: #9ca3af;
            --nav-text-hover: #f3f4f6;
            --nav-active: #6366f1;
            --nav-active-bg: rgba(99, 102, 241, 0.1);
            --nav-mobile-bg: #151a26;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* ═══ PC NAV (original) ═══ */
        .navbar {
            background: var(--nav-bg);
            border-bottom: 1px solid var(--nav-border);
            position: sticky;
            top: 0;
            z-index: 200;
            backdrop-filter: blur(16px);
        }

        .navbar-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0.75rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .navbar-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: #f3f4f6;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .navbar-brand .brand-icon { color: #6366f1; }

        .navbar-links { display: flex; gap: 0.25rem; align-items: center; }

        .navbar-link {
            color: var(--nav-text);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.45rem 0.85rem;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            position: relative;
        }

        .navbar-link:hover {
            color: var(--nav-text-hover);
            background: rgba(255, 255, 255, 0.04);
        }

        .navbar-link.active {
            color: var(--nav-active);
            background: var(--nav-active-bg);
            font-weight: 600;
        }

        .navbar-link.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: var(--nav-active);
            border-radius: 2px;
        }

        .navbar-link .nav-icon { width: 18px; height: 18px; }
        .navbar-link .nav-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2; }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 0.35rem 0.9rem 0.35rem 0.55rem;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .user-pill:hover { border-color: var(--primary); }
        .upill-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #2e3748;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            border: 2px solid var(--primary);
            overflow: hidden;
        }
        .upill-info { display: flex; flex-direction: column; gap: 1px; }
        .upill-name { font-size: 0.8rem; font-weight: 600; }
        .upill-money { font-size: 0.7rem; color: var(--orange); font-weight: 600; }
        .login-btn-header {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0.45rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .login-btn-header:hover { background: var(--primary-h); }

        /* ═══ MOBILE NAV (original) ═══ */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--nav-mobile-bg);
            border-top: 1px solid var(--nav-border);
            z-index: 199;
            padding: 0.5rem 0.25rem;
        }
        .mobile-nav-inner {
            display: flex;
            justify-content: space-around;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
        }
        .mobile-nav-link {
            color: var(--nav-text);
            text-decoration: none;
            font-size: 0.65rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            padding: 0.35rem 0.5rem;
            border-radius: 10px;
            min-width: 50px;
            position: relative;
        }
        .mobile-nav-link.active { color: var(--nav-active); }
        .mobile-nav-link.active::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: var(--nav-active);
            border-radius: 50%;
        }
        .mobile-nav-link .nav-icon { width: 22px; height: 22px; }
        .mobile-nav-link .nav-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2; }
        .mobile-nav-link .nav-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.04em; }

        /* ═══ CONTEÚDO EM BREVE ═══ */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 180px);
        }

        .coming-soon-wrapper {
            text-align: center;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .coming-soon-icon {
            font-size: 6rem;
            display: block;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .coming-soon-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--pink), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .coming-soon-subtitle {
            font-size: 1.1rem;
            color: var(--text-2);
            margin-bottom: 2rem;
            max-width: 500px;
            line-height: 1.6;
        }

        .coming-soon-features {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .feature-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            text-align: center;
            transition: var(--transition);
            min-width: 140px;
        }

        .feature-item:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .feature-icon { font-size: 2rem; display: block; margin-bottom: 0.5rem; }
        .feature-name { font-size: 0.85rem; font-weight: 600; }

        @media (max-width: 768px) {
            .navbar-links { display: none; }
            .mobile-nav { display: block; }
            .navbar-inner { padding: 0.65rem 1rem; flex-wrap: wrap; gap: 0.5rem; }
            .container { padding: 1rem; min-height: calc(100vh - 160px); }
            .upill-name { display: none; }
            .coming-soon-title { font-size: 2rem; }
            .coming-soon-icon { font-size: 4rem; }
            .coming-soon-features { gap: 1rem; }
        }
        @media (min-width: 769px) { .mobile-nav { display: none; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-inner">
            <a href="looto.html" class="navbar-brand">
                <span class="brand-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                    </svg>
                </span>
                Looto
            </a>
            <div class="navbar-links">
                <a href="looto.html" class="navbar-link">
                    <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>Sorteios
                </a>
                <a href="loja.html" class="navbar-link">
                    <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span>Loja
                </a>
                <a href="minigames.html" class="navbar-link active">
                    <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16"/></svg></span>Minijogos
                </a>
                <a href="chat.html" class="navbar-link">
                    <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>Chat
                </a>
                <a href="conta.html" class="navbar-link">
                    <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>Perfil
                </a>
            </div>
            <div id="header-auth-area">
                <button class="login-btn-header" onclick="window.location.href='login.html'">🔐 Entrar</button>
            </div>
        </div>
    </nav>

    <nav class="mobile-nav">
        <div class="mobile-nav-inner">
            <a href="looto.html" class="mobile-nav-link">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span><span class="nav-label">Sorteios</span>
            </a>
            <a href="loja.html" class="mobile-nav-link">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span><span class="nav-label">Loja</span>
            </a>
            <a href="minigames.html" class="mobile-nav-link active">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16"/></svg></span><span class="nav-label">Jogos</span>
            </a>
            <a href="chat.html" class="mobile-nav-link">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span><span class="nav-label">Chat</span>
            </a>
            <a href="conta.html" class="mobile-nav-link">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="nav-label">Perfil</span>
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="coming-soon-wrapper">
            <span class="coming-soon-icon">🚧</span>
            <h1 class="coming-soon-title">Em Breve</h1>
            <p class="coming-soon-subtitle">Estamos preparando minigames incríveis para você! Em breve você poderá desafiar outros jogadores e ganhar recompensas.</p>
            <div class="coming-soon-features">
                <div class="feature-item">
                    <span class="feature-icon">❌⭕</span>
                    <span class="feature-name">Jogo da Velha</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">✊✋✌️</span>
                    <span class="feature-name">Pedra, Papel, Tesoura</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">💣🔍</span>
                    <span class="feature-name">Campo Minado</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDUBFZkXFtIGzE-Mp4WLVWA77HzlaG9pMI",
        authDomain: "looto-f46e5.firebaseapp.com",
        databaseURL: "https://looto-f46e5-default-rtdb.firebaseio.com",
        projectId: "looto-f46e5",
        storageBucket: "looto-f46e5.firebasestorage.app",
        messagingSenderId: "295066400995",
        appId: "1:295066400995:web:cdaa28a808f71e7e6eadd6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    async function renderHeader(user) {
        if (!user) {
            document.getElementById('header-auth-area').innerHTML = '<button class="login-btn-header" onclick="window.location.href=\'login.html\'">🔐 Entrar</button>';
            return;
        }
        try {
            const snap = await get(ref(db, 'usuarios/' + user.uid));
            const data = snap.val() || {};
            const nome = data.username || user.displayName || 'Jogador';
            const money = data.dinheiro || 0;
            document.getElementById('header-auth-area').innerHTML = `
                <a href="conta.html" class="user-pill">
                    <div class="upill-avatar">${nome[0]?.toUpperCase() || '?'}</div>
                    <div class="upill-info">
                        <div class="upill-name">${nome}</div>
                        <div class="upill-money">💰 ${money}</div>
                    </div>
                </a>`;
        } catch (e) {
            console.warn('Erro ao carregar header:', e);
        }
    }

    onAuthStateChanged(auth, (user) => {
        renderHeader(user);
    });
    </script>
</body>
</html>
