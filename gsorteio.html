<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <style>
        :root {
            --bg: #0b0e14; --text: #f3f4f6; --text-2: #9ca3af; --primary: #6366f1; --primary-h: #4f46e5;
            --green: #10b981; --gold: #fbbf24; --red: #ef4444; --pink: #ec4899; --orange: #f59e0b;
            --diamond: #38bdf8; --bronze: #cd7f32; --border: rgba(255,255,255,0.06);
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body { background:#0b0e14; color:var(--text); min-height:100vh; overflow-x:hidden; }
        
        .epic-bg { position:fixed; inset:0; z-index:0; background-size:cover; background-position:center; transition:background-image 1s ease; }
        .epic-bg::before { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(11,14,20,0.2) 0%,rgba(11,14,20,0.6) 50%,rgba(11,14,20,0.95) 100%); }
        .epic-bg::after { content:''; position:absolute; inset:0; background:radial-gradient(circle at 50% 50%,rgba(99,102,241,0.15),transparent 70%); animation:bgPulse 4s infinite; }
        @keyframes bgPulse { 0%,100%{opacity:.5;transform:scale(1)} 50%{opacity:.8;transform:scale(1.02)} }
        
        .particles { position:fixed; inset:0; z-index:1; pointer-events:none; }
        .particle { position:absolute; width:3px; height:3px; background:var(--primary); border-radius:50%; animation:floatUp 8s infinite; opacity:0; box-shadow:0 0 6px var(--primary); }
        @keyframes floatUp { 0%{transform:translateY(100vh) translateX(0) scale(0);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(-10vh) translateX(60px) scale(1.5);opacity:0} }
        
        .stars { position:fixed; inset:0; z-index:0; pointer-events:none; }
        .star { position:absolute; width:2px; height:2px; background:white; border-radius:50%; animation:twinkle 3s infinite; }
        @keyframes twinkle { 0%,100%{opacity:.3} 50%{opacity:1} }
        
        .music-notification {
            position:fixed; top:2rem; right:2rem; z-index:300;
            background:rgba(21,26,38,0.95); backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.12); border-radius:20px;
            padding:1rem 1.5rem; display:none; align-items:center; gap:1rem;
            box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 40px rgba(99,102,241,0.2);
            max-width:420px; cursor:pointer; transition:all .3s;
        }
        .music-notification:hover { border-color:var(--primary); transform:scale(1.03); }
        .music-notif-icon { width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:1.8rem; flex-shrink:0; position:relative; overflow:hidden; }
        .music-notif-icon img { width:100%; height:100%; object-fit:cover; border-radius:16px; position:absolute; inset:0; }
        .music-notif-icon.spotify { background:linear-gradient(135deg,#1DB954,#169c46); }
        .music-notif-icon.youtube { background:linear-gradient(135deg,#FF0000,#cc0000); }
        .music-notif-icon.soundcloud { background:linear-gradient(135deg,#ff5500,#ff3300); }
        .music-notif-info { flex:1; min-width:0; }
        .music-notif-label { font-size:.7rem; color:var(--green); text-transform:uppercase; letter-spacing:.1em; font-weight:600; margin-bottom:.2rem; display:flex; align-items:center; gap:.3rem; }
        .music-notif-label .dot { width:6px; height:6px; background:var(--green); border-radius:50%; animation:dotPulse 1.5s infinite; }
        @keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:.2} }
        .music-notif-title { font-family:'Space Grotesk',sans-serif; font-size:.95rem; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .music-notif-artist { font-size:.75rem; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .music-notif-wave { display:flex; align-items:flex-end; gap:2px; height:20px; flex-shrink:0; }
        .music-notif-wave .bar { width:2px; background:var(--primary); border-radius:2px; animation:wave 1.2s infinite; }
        .music-notif-wave .bar:nth-child(1){height:8px;animation-delay:0s} .music-notif-wave .bar:nth-child(2){height:16px;animation-delay:.2s}

        @keyframes wave { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(.3)} }
        
        .music-player {
            position:fixed; bottom:2rem; left:50%; transform:translateX(-50%); z-index:200;

        .music-toggle:hover { background:var(--primary); transform:scale(1.1); }
        .music-vol { width:60px; cursor:pointer; accent-color:var(--primary); }

        .btn-back:hover { border-color:var(--primary); color:var(--primary); background:rgba(21,26,38,0.95); }
        
        .toast { position:fixed; top:1.5rem; right:1.5rem; z-index:400; background:#151a26; border:1px solid var(--red); padding:.8rem 1.2rem; border-radius:12px; font-size:.85rem; transform:translateX(140%); transition:all .3s cubic-bezier(0.4,0,0.2,1); backdrop-filter:blur(10px); max-width:350px; box-shadow:0 10px 30px rgba(0,0,0,0.5); }
        .toast.show { transform:translateX(0); }
        .toast.ok { border-color:var(--green); }
        
        @media (max-width:768px) {
            .main-content { padding:5rem 1rem 7rem; }
            .gs-title { font-size:1.8rem; }
            .countdown-container { gap:.5rem; } .countdown-item { padding:.8rem .8rem; min-width:60px; border-radius:14px; } .countdown-number { font-size:1.6rem; }
            .btn-participate { padding:1rem 2.5rem; font-size:1rem; }

            .winner-popup { padding:1.5rem; } .winner-popup div { font-size:1.2rem; }
        }
    </style>
</head>

// ═══════════ 100 NÍVEIS ═══════════
function gerarNiveis() {
    const ranks = [
        { min:0, max:4, nome:'Bronze', icon:'🥉', cor:'#cd7f32' },
        { min:5, max:9, nome:'Ferro', icon:'⚙️', cor:'#8b8b8b' },
        { min:10, max:14, nome:'Prata', icon:'🪙', cor:'#9ca3af' },

        { min:25, max:29, nome:'Esmeralda', icon:'💚', cor:'#10b981' },
        { min:30, max:34, nome:'Rubi', icon:'❤️', cor:'#ef4444' },
        { min:35, max:39, nome:'Safira', icon:'💙', cor:'#3b82f6' },
        { min:40, max:44, nome:'Épico', icon:'👑', cor:'#fbbf24' },
        { min:45, max:49, nome:'Lendário', icon:'🌟', cor:'#ff8c00' },
        { min:50, max:54, nome:'Mítico', icon:'🔮', cor:'#ec4899' },
        { min:55, max:59, nome:'Celestial', icon:'🌌', cor:'#6366f1' },
        { min:60, max:64, nome:'Transcendente', icon:'⚡', cor:'#d946ef' },
        { min:65, max:69, nome:'Divino', icon:'🕊️', cor:'#e0e0e0' },
        { min:70, max:74, nome:'Supremo', icon:'💎', cor:'#38bdf8' },
        { min:75, max:79, nome:'Imortal', icon:'🔥', cor:'#f97316' },
        { min:80, max:84, nome:'Cósmico', icon:'🌠', cor:'#14b8a6' },
        { min:85, max:89, nome:'Abissal', icon:'🌊', cor:'#0ea5e9' },
        { min:90, max:94, nome:'Eterno', icon:'⏳', cor:'#eab308' },
        { min:95, max:99, nome:'Looto Master', icon:'🏆', cor:'#22c55e' }
    ];
    const niveis = [];
    for(const r of ranks) {
        for(let i = r.min; i <= r.max; i++) {
            const xpNecessario = Math.floor(100 * Math.pow(1.15, i));
            niveis.push({ nivel: i, nome: r.nome, icon: r.icon, cor: r.cor, xpNecessario });
        }
    }
    return niveis;
}
const NIVEIS_100 = gerarNiveis();

function getNivelByXP(xp) {
    for(let i = NIVEIS_100.length - 1; i >= 0; i--) {
        if(xp >= NIVEIS_100[i].xpNecessario) return NIVEIS_100[i];
    }
    return NIVEIS_100[0];
}

function getContrastColor(hex) {
    if (!hex || hex.length < 7) return '#fff';
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
    return luminance > 0.6 ? '#333' : '#fff';
}

function toast(msg, ok = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (ok ? ' ok' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 3000);
}

function createParticles() {
    const container = document.getElementById('particles');
    const colors = ['#6366f1', '#a855f7', '#ec4899', '#fbbf24', '#10b981'];
    for (let i = 0; i < 40; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 8 + 's';
        particle.style.animationDuration = (6 + Math.random() * 10) + 's';
        particle.style.background = colors[Math.floor(Math.random() * colors.length)];
        container.appendChild(particle);
    }
}

function createStars() {
    const container = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 3 + 's';
        star.style.animationDuration = (2 + Math.random() * 4) + 's';
        container.appendChild(star);
    }
}

function startTimer(expiraEm) {
    if (timerInterval) clearInterval(timerInterval);
    function update() {
        const diff = expiraEm - Date.now();
        if (diff <= 0) {
            clearInterval(timerInterval);
            ['days','hours','minutes','seconds'].forEach(id => document.getElementById(id).textContent = '00');
            if (!sorteioFinalizado && gsData && gsData.ativo && !gsData.sorteioRealizado) {
                finalizarGrandeSorteio();
            }
            return;
        }
        document.getElementById('days').textContent = String(Math.floor(diff/86400000)).padStart(2,'0');
        document.getElementById('hours').textContent = String(Math.floor((diff%86400000)/3600000)).padStart(2,'0');
        document.getElementById('minutes').textContent = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
        document.getElementById('seconds').textContent = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
    }
    update();
    timerInterval = setInterval(update, 1000);
}

function initMusic(musicUrl, musicName, musicArtist, musicPlatform, musicIconUrl) {
    if (!musicUrl) return;
    const player = document.getElementById('music-player');
    const audio = document.getElementById('bg-music');
    const notif = document.getElementById('music-notification');
    const notifIcon = document.getElementById('music-notif-icon');
    
    document.getElementById('music-notif-title').textContent = musicName || 'Música Épica';
    document.getElementById('music-notif-artist').textContent = musicArtist || 'Grande Sorteio';
    
    if (musicIconUrl) {
        notifIcon.innerHTML = `<img src="${musicIconUrl}" alt="Música">`;
        notifIcon.className = 'music-notif-icon';
    } else {
        notifIcon.innerHTML = '🎵';
        notifIcon.className = 'music-notif-icon ' + (musicPlatform || 'spotify');
    }
    
    player.style.display = 'flex';
    audio.src = musicUrl;
    audio.volume = 0.3;
    audio.loop = true;
    
    notif.style.display = 'flex';
    
    audio.play().then(() => {
        musicPlaying = true;
        document.getElementById('music-toggle').textContent = '🔊';
    }).catch(() => {
        musicPlaying = false;
        document.getElementById('music-toggle').textContent = '🔇';
    });
    
    setTimeout(() => { notif.style.display = 'none'; }, 8000);
}

window.toggleMusic = function() {
    const audio = document.getElementById('bg-music');
    if (musicPlaying) { audio.pause(); musicPlaying = false; document.getElementById('music-toggle').textContent = '🔇'; }
    else { audio.play().then(() => { musicPlaying = true; document.getElementById('music-toggle').textContent = '🔊'; }).catch(() => toast('🎵 Clique para liberar')); }
};

window.changeVolume = function() {
    document.getElementById('bg-music').volume = document.getElementById('music-vol').value / 100;
};

async function getUserData(uid) {
    const cached = userCache.get(uid);
    if (cached && Date.now() - cached.ts < CACHE_TTL) return cached.data;
    try {
        const snap = await get(ref(db, 'usuarios/' + uid));
        const data = snap.val() || {};
        userCache.set(uid, { data, ts: Date.now() });
        if (userCache.size > 200) {
            const now = Date.now();
            for (const [k, v] of userCache) {
                if (now - v.ts > CACHE_TTL) userCache.delete(k);
            }
        }
        return data;
    } catch(e) { return {}; }
}

function renderParticipantAvatar(uid, nome) {
    const container = document.createElement('div');
    container.className = 'participant-avatar';
    container.title = nome || 'Anônimo';
    container.style.position = 'relative';
    
    getUserData(uid).then(userData => {
        const nd = getNivelByXP(userData.pontos || 0);
        const textColor = getContrastColor(nd.cor);
        const fotoUrl = userData.usandoGif ? userData.gifUrl : (userData.fotoUrl || '');
        const molduraUrl = userData.molduraEquipada || null;
        
        container.innerHTML = '';
        
        if (molduraUrl) {
            const molduraDiv = document.createElement('div');
            molduraDiv.className = 'participant-moldura';
            molduraDiv.innerHTML = `<img src="${molduraUrl}" alt="Moldura">`;
            container.appendChild(molduraDiv);
        }
        
        if (fotoUrl) {
            const img = document.createElement('img');
            img.src = fotoUrl;
            img.alt = nome || 'Avatar';
            img.onerror = () => {
                img.remove();
                container.insertAdjacentHTML('afterbegin', (nome || '?')[0].toUpperCase());
            };
            container.insertBefore(img, container.firstChild);
        } else {
            container.textContent = (nome || '?')[0].toUpperCase();
        }
        
        const nivelBadge = document.createElement('span');
        nivelBadge.className = 'participant-level-mini';
        nivelBadge.style.background = nd.cor;
        nivelBadge.style.color = textColor;
        nivelBadge.textContent = nd.nivel + 1;
        nivelBadge.title = `${nd.nome} — Nível ${nd.nivel}`;
        container.appendChild(nivelBadge);
    });
    
    return container;
}

// ═══════════ CARREGAR RECOMPENSAS ═══════════
async function loadRewardConfig() {
    try {
        const snap = await get(ref(db, 'recompensasGS'));
        if (snap.exists()) {
            recompensasConfig = snap.val();
        } else {
            recompensasConfig = {
                gsVencedorMoney: 0,
                gsVencedorXp: 1000,
                gsParticipanteMoney: 0,
                gsParticipanteXp: 150,
                criadorMoney: 0,
                criadorXp: 0
            };
        }
        return recompensasConfig;
    } catch(e) {
        recompensasConfig = {
            gsVencedorMoney: 20,
            gsVencedorXp: 1000,
            gsParticipanteMoney: 5,
            gsParticipanteXp: 150,
            criadorMoney: 0,
            criadorXp: 100
        };
        return recompensasConfig;
    }
}

// ═══════════ FINALIZAR SORTEIO ═══════════
async function finalizarGrandeSorteio() {
    if (sorteioFinalizado) return;
    sorteioFinalizado = true;
    
    console.log("🎲 FINALIZANDO GRANDE SORTEIO...");
    
    // Garantir que recompensas estejam carregadas
    if (!recompensasConfig) {
        await loadRewardConfig();
    }
    
    const snap = await get(ref(db, 'grandesorteio'));
    const sorteio = snap.val();
    if (!sorteio) return;
    if (sorteio.sorteioRealizado === true) return;
    
    const participantes = sorteio.participantes || {};
    const participantesUids = Object.keys(participantes);
    
    if (participantesUids.length === 0) {
        await update(ref(db, 'grandesorteio'), {
            ativo: false,
            sorteioRealizado: true,
            encerradoEm: Date.now(),
            mensagem: "Sorteio cancelado - sem participantes"
        });
        toast("❌ Sorteio cancelado - nenhum participante!");
        return;
    }
    
    const winnerId = participantesUids[Math.floor(Math.random() * participantesUids.length)];
    const winnerData = participantes[winnerId];
    
    console.log("🏆 VENCEDOR:", winnerData.nome);
    
    // DISTRIBUIR RECOMPENSAS E NOTIFICAÇÕES
    for (const uid of participantesUids) {
        try {
            const userSnap = await get(ref(db, `usuarios/${uid}`));
            const userData = userSnap.val() || {};
            let rewardMoney = 0, rewardXp = 0;
            let notifType = 'lose';
            let notifTitle = '🎲 PARTICIPAÇÃO NO GRANDE SORTEIO';
            let texto = '';
            
            if (uid === winnerId) {
                rewardMoney = recompensasConfig.gsVencedorMoney || 0;
                rewardXp = recompensasConfig.gsVencedorXp || 1000;
                notifType = 'win';
                notifTitle = '🏆 VITÓRIA NO GRANDE SORTEIO';
                texto = `🎉 PARABÉNS! Você venceu o GRANDE SORTEIO!`;
            } else {
                rewardMoney = recompensasConfig.gsParticipanteMoney || 0;
                rewardXp = recompensasConfig.gsParticipanteXp || 150;
                notifType = 'lose';
                texto = `😢 Infelizmente não foi dessa vez. Continue participando!`;
            }
            
            await update(ref(db, `usuarios/${uid}`), { 
                dinheiro: (userData.dinheiro || 0) + rewardMoney, 
                pontos: (userData.pontos || 0) + rewardXp 
            });
            
            await push(ref(db, 'chat'), {
                uid: uid,
                nome: userData.username || 'Usuário',
                texto: texto,
                ts: Date.now(),
                type: 'notification',
                notifType: notifType,
                notifTitle: notifTitle,
                rewards: { money: rewardMoney, xp: rewardXp },
                sorteioId: 'grande-sorteio'
            });
        } catch(e) {
            console.error('Erro ao processar participante:', uid, e);
        }
    }
    
    // ENTREGAR KEYS
    if (sorteio.keys && sorteio.keys.length > 0) {
        for (const keyData of sorteio.keys) {
            try {
                await push(ref(db, 'chat'), {
                    uid: winnerId,
                    nome: winnerData.nome || 'Vencedor',
                    texto: '',
                    ts: Date.now(),
                    type: 'treasure',
                    keyCode: keyData.key,
                    keyGame: keyData.nome || 'Grande Sorteio',
                    keyPlatform: keyData.plataforma || 'Steam',
                    sorteioId: 'grande-sorteio',
                    opened: false
                });
            } catch(e) {
                console.error('Erro ao entregar key:', e);
            }
        }
    }
    
    // MENSAGEM GLOBAL
    try {
        await push(ref(db, 'chat'), {
            uid: 'system',
            nome: '🎉 Sistema',
            texto: `🏆✨ GRANDE SORTEIO FINALIZADO! O VENCEDOR FOI @${winnerData.nome}! Ganhou ${recompensasConfig.gsVencedorMoney} Money e ${recompensasConfig.gsVencedorXp} XP! Todos os participantes ganharam ${recompensasConfig.gsParticipanteMoney} Money e ${recompensasConfig.gsParticipanteXp} XP! Parabéns! 🎉✨`,
            ts: Date.now(),
            type: 'system'
        });
    } catch(e) {
        console.error('Erro ao enviar mensagem global:', e);
    }
    
    // ATUALIZAR STATUS
    await update(ref(db, 'grandesorteio'), {
        ativo: false,
        sorteioRealizado: true,
        encerradoEm: Date.now(),
        vencedor: { uid: winnerId, nome: winnerData.nome, data: Date.now() }
    });
    
    // POPUP
    const winnerPopup = document.createElement('div');
    winnerPopup.className = 'winner-popup';
    winnerPopup.innerHTML = `
        <div style="font-size: 4rem;">🏆✨</div>
        <div style="font-family: 'Space Grotesk', sans-serif; font-size: 2rem; font-weight: 700; color: var(--gold); margin: 0.5rem 0;">VENCEDOR!</div>
        <div style="font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem;">${winnerData.nome}</div>
        <div style="color: var(--text-2); margin-bottom: 1rem;">Ganhou ${recompensasConfig.gsVencedorMoney} Money + ${recompensasConfig.gsVencedorXp} XP!</div>
        <button onclick="this.parentElement.remove()">Fechar</button>
    `;
    document.body.appendChild(winnerPopup);
    
    // ATUALIZAR INTERFACE
    document.getElementById('gs-status').textContent = '🏆 ENCERRADO';
    document.getElementById('gs-status').className = 'gs-badge encerrado';
    document.getElementById('btn-participate').disabled = true;
    document.getElementById('btn-participate').textContent = '🏆 Sorteio Encerrado';
    if (timerInterval) clearInterval(timerInterval);
    document.getElementById('countdown').style.display = 'none';
    
    toast(`🏆 Sorteio finalizado! Vencedor: ${winnerData.nome}!`, true);
}

// ═══════════ CARREGAR DADOS DO SORTEIO ═══════════
function loadGrandeSorteio() {
    onValue(ref(db, 'grandesorteio'), (snap) => {
        if (!snap.exists()) {
            document.getElementById('gs-title').textContent = '🚫 Nenhum Grande Sorteio ativo';
            document.getElementById('btn-participate').disabled = true;
            document.getElementById('countdown').style.display = 'none';
            return;
        }
        
        gsData = snap.val();
        
        document.getElementById('gs-title').textContent = gsData.titulo || 'Grande Sorteio Épico';
        document.getElementById('gs-description').textContent = gsData.descricao || '';
        
        if (gsData.wallpaper) {
            document.getElementById('epic-bg').style.backgroundImage = `url('${gsData.wallpaper}')`;
        }
        
        const nivelAcesso = gsData.nivelAcesso || 'publico';
        const nivelBadge = document.getElementById('gs-nivel-badge');
        nivelBadge.textContent = NIVEL_NOME_GS[nivelAcesso] || '🌍 Público (Todos)';
        nivelBadge.className = 'gs-nivel-badge ' + nivelAcesso;
        
        const badge = document.getElementById('gs-status');
        const btn = document.getElementById('btn-participate');
        
        if (!gsData.ativo || gsData.emBreve) {
            badge.textContent = '⏸️ EM BREVE';
            badge.className = 'gs-badge em-breve';
            btn.disabled = true;
            btn.textContent = '⏳ Em Breve...';
        } else if (gsData.sorteioRealizado === true || (gsData.expiraEm && gsData.expiraEm < Date.now())) {
            badge.textContent = '🏆 ENCERRADO';
            badge.className = 'gs-badge encerrado';
            btn.disabled = true;
            btn.textContent = 'Sorteio Encerrado';
        } else {
            badge.textContent = '🔴 AO VIVO';
            badge.className = 'gs-badge live';
        }
        
        if (gsData.expiraEm && gsData.ativo && !gsData.emBreve && !gsData.sorteioRealizado) {
            document.getElementById('countdown').style.display = 'flex';
            startTimer(gsData.expiraEm);
        }
        
        const keys = gsData.keys || [];
        document.getElementById('gs-keys-count').textContent = keys.length;
        if (keys.length > 0) {
            document.getElementById('keys-section').style.display = 'block';
            document.getElementById('keys-grid').innerHTML = keys.map(k => `
                <div class="key-card"><div class="key-game">🎮 ${k.nome || 'Jogo'}</div><div class="key-platform">${k.plataforma || 'Steam'}</div></div>`).join('');
        }
        
        const max = gsData.maxParticipantes || 0;
        document.getElementById('gs-max-text').textContent = max === 0 ? '∞' : max;
        
        const participantes = gsData.participantes || {};
        const pIds = Object.keys(participantes);
        document.getElementById('gs-participants-count').textContent = pIds.length;
        
        const list = document.getElementById('participants-list');
        if (pIds.length === 0) {
            list.innerHTML = '<span style="color:var(--text-2);font-size:.8rem;">Seja o primeiro! 🎉</span>';
        } else {
            list.innerHTML = '';
            pIds.slice(0, 50).forEach(uid => {
                const p = participantes[uid];
                const avatar = renderParticipantAvatar(uid, p.nome || 'Anônimo');
                list.appendChild(avatar);
            });
            if (pIds.length > 50) {
                list.innerHTML += `<span style="font-size:.7rem;color:var(--text-2);">+${pIds.length-50} mais</span>`;
            }
        }
        
        // ═══ CORREÇÃO PRINCIPAL: Verificação segura do currentUser ═══
        if (currentUser && currentUser.uid) {
            if (participantes[currentUser.uid]) {
                btn.disabled = true;
                btn.textContent = '✅ Você já está participando!';
            } else if (gsData.ativo && !gsData.emBreve && !gsData.sorteioRealizado) {
                btn.disabled = false;
                btn.textContent = '🎁 Participar Agora';
            } else {
                btn.disabled = true;
            }
        }
        
        if (gsData.musicUrl) {
            initMusic(gsData.musicUrl, gsData.musicName, gsData.musicArtist, gsData.musicPlatform, gsData.musicIconUrl);
        }
    });
}

// ═══════════ PARTICIPAR (CORRIGIDO) ═══════════
window.participate = async function() {
    // Verificação inicial robusta
    if (!currentUser || !currentUser.uid) {
        toast('🔐 Faça login primeiro!');
        setTimeout(() => window.location.href = 'login.html', 1500);
        return;
    }
    
    if (!gsData) {
        toast('⏳ Carregando sorteio...');
        return;
    }
    
    const nivelAcesso = gsData.nivelAcesso || 'publico';
    const nivelRequerido = NIVEL_REQ_GS[nivelAcesso] || 0;
    
    try {
        // Buscar dados do usuário de forma segura
        const userSnap = await get(ref(db, 'usuarios/' + currentUser.uid));
        if (!userSnap.exists()) {
            toast('⚠️ Perfil não encontrado. Recarregue a página.');
            return;
        }
        const userData = userSnap.val();
        
        if (nivelAcesso === 'exclusivo') {
            if (!userData.premium) {
                toast('⭐ Exclusivo para assinantes!', false);
                return;
            }
        } else {
            const userNivel = getNivelByXP(userData.pontos || 0).nivel;
            if (userNivel < nivelRequerido) {
                toast(`🔒 Requer ${NIVEL_NOME_GS[nivelAcesso]}! Seu nível: ${userNivel}`, false);
                return;
            }
        }
        
        if (!gsData.ativo || gsData.emBreve) { toast('⏸️ Ainda não começou!'); return; }
        if (gsData.expiraEm && gsData.expiraEm < Date.now()) { toast('⏰ Encerrado!'); return; }
        if (gsData.sorteioRealizado) { toast('🏆 Sorteio já foi realizado!'); return; }
        
        const participantes = gsData.participantes || {};
        if (participantes[currentUser.uid]) { toast('✅ Já está participando!', true); return; }
        
        const max = gsData.maxParticipantes || 0;
        if (max > 0 && Object.keys(participantes).length >= max) { toast('🔴 Lotado!'); return; }
        
        const nome = userData.username || currentUser.displayName || 'Usuário';
        participantes[currentUser.uid] = { uid: currentUser.uid, nome: nome, entradoEm: Date.now() };
        await update(ref(db, 'grandesorteio'), { participantes });
        
        document.getElementById('btn-participate').disabled = true;
        document.getElementById('btn-participate').textContent = '✅ Você está participando!';
        toast('🎉 Entrou no Grande Sorteio! 🍀', true);
    } catch(e) {
        console.error('Erro ao participar:', e);
        toast('Erro: ' + e.message);
    }
};

// ═══════════ VERIFICAÇÃO PERIÓDICA ═══════════
setInterval(async () => {
    if (gsData && gsData.expiraEm && gsData.expiraEm <= Date.now() && !gsData.sorteioRealizado && gsData.ativo) {
        await finalizarGrandeSorteio();
    }
}, 10000);

// ═══════════ INICIALIZAÇÃO ═══════════
onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    await loadRewardConfig();
    loadGrandeSorteio();
});
createParticles();
createStars();
</script>
