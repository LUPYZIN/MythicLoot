<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looto | Grande Sorteio Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14; --bg-card: #151a26; --text: #f3f4f6; --text-2: #9ca3af;
            --primary: #6366f1; --green: #10b981; --red: #ef4444; --gold: #fbbf24;
            --orange: #f59e0b; --pink: #ec4899; --diamond: #38bdf8; --bronze: #cd7f32;
            --border: rgba(255, 255, 255, 0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }
        
        header { background: rgba(11, 14, 20, 0.95); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(16px); padding: .9rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .5rem; }
        .logo { font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--text); text-decoration: none; }
        .logo em { color: var(--red); font-style: normal; }
        .btn-header { background: transparent; border: 1px solid var(--border); color: var(--text-2); padding: .4rem .8rem; border-radius: 6px; font-size: .8rem; cursor: pointer; transition: .3s; text-decoration: none; }
        .btn-header:hover { border-color: var(--red); color: var(--red); }
        
        .main-layout { max-width: 1600px; margin: 0 auto; padding: 1.5rem 2rem; display: grid; grid-template-columns: 220px 1fr; gap: 1.5rem; }
        .sidebar { background: var(--bg-card); border-radius: 14px; border: 1px solid var(--border); padding: 1rem; position: sticky; top: 80px; height: fit-content; }
        .sidebar-btn { background: transparent; border: none; color: var(--text-2); padding: .7rem 1rem; border-radius: 8px; font-size: .85rem; cursor: pointer; transition: .3s; text-align: left; display: flex; align-items: center; gap: .5rem; width: 100%; text-decoration: none; }
        .sidebar-btn:hover { background: rgba(255, 255, 255, .03); color: var(--text); }
        .sidebar-btn.active { background: rgba(99, 102, 241, .12); color: var(--primary); font-weight: 600; }
        
        .panel { background: var(--bg-card); border-radius: 14px; border: 1px solid var(--border); padding: 1.5rem; }
        .panel-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: .5rem; }
        
        input, select, textarea { background: rgba(11, 14, 20, .6); border: 1px solid var(--border); padding: .5rem .7rem; border-radius: 6px; color: var(--text); font-size: .82rem; outline: none; width: 100%; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }
        
        .btn { padding: .5rem 1rem; border-radius: 6px; font-size: .8rem; font-weight: 600; cursor: pointer; border: none; transition: .3s; margin: .15rem; }
        .btn.primary { background: var(--primary); color: #fff; }
        .btn.red { background: var(--red); color: #fff; }
        .btn.green { background: var(--green); color: #fff; }
        .btn.orange { background: var(--orange); color: #000; }
        .btn.gold { background: var(--gold); color: #000; }
        .btn.pink { background: var(--pink); color: #fff; }
        
        .btn-sm { padding: .3rem .6rem; border-radius: 4px; font-size: .7rem; font-weight: 600; cursor: pointer; border: none; transition: .3s; margin: .1rem; }
        .btn-sm.primary { background: var(--primary); color: #fff; }
        .btn-sm.red { background: var(--red); color: #fff; }
        
        .field { margin-bottom: .8rem; }
        .field label { font-size: .75rem; color: var(--text-2); display: block; margin-bottom: .2rem; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
        .field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .75rem; }
        
        .key-item { display: flex; gap: .4rem; align-items: center; background: rgba(255, 255, 255, .02); padding: .4rem; border-radius: 6px; border: 1px solid var(--border); margin-bottom: .3rem; }
        .key-item input { flex: 1; }
        .key-item select { width: auto; }
        
        .gs-preview { background: linear-gradient(135deg, #0f1420, #1a0533, #3b1f5e); border-radius: 14px; padding: 2rem; text-align: center; margin-bottom: 1rem; position: relative; overflow: hidden; }
        .gs-preview::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, .2), transparent 70%); }
        .gs-preview h2 { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; position: relative; z-index: 1; text-shadow: 0 0 30px rgba(99, 102, 241, .5); }
        .gs-preview .gs-sub { font-size: .9rem; color: var(--text-2); position: relative; z-index: 1; margin: .3rem 0; }
        .gs-preview .gs-info { font-size: .78rem; margin-top: .3rem; position: relative; z-index: 1; }
        .gs-preview .gs-badges { display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; margin-top: .5rem; position: relative; z-index: 1; }
        .music-info-row { display: flex; align-items: center; justify-content: center; gap: .8rem; flex-wrap: wrap; margin-top: .5rem; position: relative; z-index: 1; }
        .music-icon-preview { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; border: 2px solid var(--primary); background: rgba(0,0,0,.4); flex-shrink: 0; }
        .music-player-bar { background: rgba(0, 0, 0, .5); border-radius: 8px; padding: .6rem 1rem; margin-top: .8rem; display: flex; align-items: center; gap: .5rem; position: relative; z-index: 1; }
        .music-player-bar audio { flex: 1; height: 28px; }
        
        .participants-preview { margin-top: .8rem; position: relative; z-index: 1; }
        .participants-preview h4 { font-size: .8rem; color: var(--text-2); margin-bottom: .3rem; }
        .participant-avatar { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: rgba(99, 102, 241, .2); border: 2px solid var(--primary); font-size: .6rem; font-weight: 700; margin: 2px; color: var(--text); }
        
        hr { border-color: var(--border); margin: 1rem 0; }
        
        .toast { position: fixed; top: 1.5rem; right: 1.5rem; background: var(--bg-card); border: 1px solid var(--red); padding: .8rem 1.2rem; border-radius: 12px; font-size: .85rem; z-index: 999; transform: translateX(140%); transition: .3s; max-width: 320px; }
        .toast.show { transform: translateX(0); }
        .toast.ok { border-color: var(--green); }
        
        .badge { padding: .15rem .5rem; border-radius: 99px; font-size: .7rem; font-weight: 600; display: inline-block; }
        .badge-green { background: rgba(16, 185, 129, .15); color: var(--green); }
        .badge-gold { background: rgba(251, 191, 36, .15); color: var(--gold); }
        .badge-red { background: rgba(239, 68, 68, .15); color: var(--red); }
        .badge-blue { background: rgba(99, 102, 241, .15); color: var(--primary); }
        .badge-pink { background: rgba(236, 72, 153, .15); color: var(--pink); }
        .badge-diamond { background: rgba(56, 189, 248, .15); color: var(--diamond); }
        
        @media (max-width: 768px) { .main-layout { grid-template-columns: 1fr; padding: 1rem; } .sidebar { display: flex; flex-wrap: wrap; gap: .3rem; position: static; } .sidebar-btn { width: auto; font-size: .7rem; padding: .4rem .6rem; } .field-row, .field-row-3 { grid-template-columns: 1fr; } .gs-preview h2 { font-size: 1.3rem; } }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>
    
    <header>
        <a href="looto.html" class="logo"><em>🛡️</em> Looto Admin</a>
        <span id="admin-info" style="font-size:.8rem;color:var(--text-2);"></span>
        <div>
            <a href="looto.html" class="btn-header">🏠 Site</a>
            <button class="btn-header" onclick="logout()" style="margin-left:.5rem;">🚪 Sair</button>
        </div>
    </header>
    
    <div class="main-layout">
        <aside class="sidebar">
            <a href="admin.html" class="sidebar-btn">📊 Dashboard</a>
            <a href="auser.html" class="sidebar-btn">👥 Usuários</a>
            <a href="abots.html" class="sidebar-btn">🤖 Bots</a>
            <a href="asorteios.html" class="sidebar-btn">🎁 Sorteios</a>
            <a href="alogsorteios.html" class="sidebar-btn">📋 Log Sorteios</a>
            <a href="achat.html" class="sidebar-btn">💬 Chat</a>
            <a href="agrandesorteio.html" class="sidebar-btn active">🏆 Grande Sorteio</a>
            <a href="aloja.html" class="sidebar-btn">🛒 Loja</a>
            <a href="admins.html" class="sidebar-btn">🔑 Admins</a>
            <a href="aassinantes.html" class="sidebar-btn">⭐ Assinantes</a>
            <a href="aferramentas.html" class="sidebar-btn">🔧 Ferramentas</a>
        </aside>
        
        <div class="panel">
            <div class="panel-title">🏆 Grande Sorteio Épico</div>
            
            <div class="gs-preview" id="gs-preview">
                <h2 id="gs-preview-title">🎮 Grande Sorteio Épico</h2>
                <p class="gs-sub" id="gs-preview-desc">Prepare-se para algo lendário!</p>
                <div class="gs-badges">
                    <span class="badge badge-blue" id="gs-preview-keys-info">🔑 0 keys</span>
                    <span class="badge badge-green" id="gs-preview-status">⏸️ Em Breve</span>
                    <span class="badge badge-gold" id="gs-preview-nivel">🌍 Público</span>
                    <span class="badge badge-pink" id="gs-preview-parts-info">👥 0</span>
                </div>
                <div class="music-info-row" id="music-info-row">
                    <img id="gs-preview-music-icon" class="music-icon-preview" src="" style="display:none;" alt="Ícone da música">
                    <div class="gs-info" id="gs-preview-music-info" style="color:var(--primary);">🎵 Nenhuma música</div>
                </div>
                <div class="music-player-bar" id="gs-music-bar" style="display:none;">
                    <audio id="gs-music-audio" controls loop style="flex:1;height:25px;"></audio>
                    <button class="btn-sm red" onclick="pararMusica()">⏹️</button>
                </div>
                <div class="participants-preview" id="participants-preview"></div>
            </div>
            
            <div class="field-row">
                <div class="field"><label>🏷️ Título</label><input type="text" id="gs-titulo" oninput="atualizarPreview()" placeholder="Super Sorteio Épico"></div>
                <div class="field"><label>📝 Descrição</label><input type="text" id="gs-descricao" oninput="atualizarPreview()" placeholder="O maior sorteio..."></div>
            </div>
            <div class="field-row">
                <div class="field"><label>🖼️ URL Imagem de Fundo</label><input type="text" id="gs-wallpaper" placeholder="https://..."></div>
                <div class="field"><label>🔗 URL da Música (MP3)</label><input type="text" id="gs-music-url" placeholder="https://...musica.mp3" onchange="atualizarPreview()"></div>
            </div>
            <div class="field-row-3">
                <div class="field"><label>🎵 Nome da Música</label><input type="text" id="gs-music-name" placeholder="Ex: Só Confie em Mim" oninput="atualizarPreview()"></div>
                <div class="field"><label>🎤 Artista</label><input type="text" id="gs-music-artist" placeholder="Ex: Mundo Torajo" oninput="atualizarPreview()"></div>
                <div class="field"><label>📻 Plataforma</label><select id="gs-music-platform" onchange="atualizarPreview()">
                    <option value="spotify">🟢 Spotify</option><option value="youtube">🔴 YouTube</option>
                    <option value="soundcloud">🟠 SoundCloud</option><option value="other">⚪ Outro</option>
                </select></div>
            </div>
            <div class="field-row">
                <div class="field"><label>🖼️ Ícone da Música (URL GIF/Imagem)</label><input type="text" id="gs-music-icon" placeholder="https://...gif ou .png" oninput="atualizarPreview()"></div>
                <div class="field"><label></label></div>
            </div>
            <div class="field-row-3">
                <div class="field"><label>⏱️ Duração (horas)</label><input type="number" id="gs-duracao" value="72" min="1"></div>
                <div class="field"><label>👥 Máx. Participantes</label><input type="number" id="gs-max" value="0" min="0"><span style="font-size:.65rem;color:var(--text-2);">0 = ilimitado</span></div>
                <div class="field"><label>🔒 Nível de Acesso</label><select id="gs-nivel" onchange="atualizarPreview()">
                    <option value="publico">🌍 Público (Todos)</option>
                    <option value="prata">🥈 Prata+ (Nível 10+)</option>
                    <option value="ouro">🥇 Ouro+ (Nível 15+)</option>
                    <option value="diamante">💎 Diamante+ (Nível 30+)</option>
                    <option value="exclusivo">⭐ Exclusivo (Assinantes)</option>
                </select></div>
            </div>
            <div class="field-row">
                <div class="field"><label>Status</label><select id="gs-ativo"><option value="false">⏸️ Em Breve</option><option value="true">🔴 Ao Vivo</option></select></div>
                <div class="field"><label>🔗 URL de Redirecionamento</label><input type="text" id="gs-redirect" value="gsorteio.html" placeholder="gsorteio.html"></div>
            </div>
            
            <div class="field"><label>🔑 Keys para Sortear</label>
                <div id="key-list"></div>
                <button class="btn-sm primary" onclick="addKey()">➕ Adicionar Key</button>
            </div>
            
            <hr>
            
            <div style="display:flex;flex-wrap:wrap;gap:.3rem;">
                <button class="btn primary" onclick="salvarGrandeSorteio()">💾 Salvar</button>
                <button class="btn green" onclick="ativarGrandeSorteio()">▶️ Ativar</button>
                <button class="btn orange" onclick="pausarGrandeSorteio()">⏸️ Pausar</button>
                <button class="btn gold" onclick="sortearVencedor()">🎲 Sortear Vencedor</button>
                <button class="btn red" onclick="resetarGrandeSorteio()">🔄 Resetar Part.</button>
                <button class="btn red" onclick="apagarGrandeSorteio()">🗑️ Apagar Tudo</button>
            </div>
        </div>
    </div>
    
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { getDatabase, ref, set, get, update, remove, push } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyDUBFZkXFtIGzE-Mp4WLVWA77HzlaG9pMI",
        authDomain: "looto-f46e5.firebaseapp.com",
        databaseURL: "https://looto-f46e5-default-rtdb.firebaseio.com",
        projectId: "looto-f46e5",
        storageBucket: "looto-f46e5.firebasestorage.app",
        messagingSenderId: "295066400995",
        appId: "1:295066400995:web:cdaa28a808f71e7e6eadd6"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    
    // ═══════════ 100 NÍVEIS ═══════════
    function gerarNiveis() {
        const ranks = [
            { min:0, max:4, nome:'Bronze', icon:'🥉', cor:'#cd7f32' },
            { min:5, max:9, nome:'Ferro', icon:'⚙️', cor:'#8b8b8b' },
            { min:10, max:14, nome:'Prata', icon:'🪙', cor:'#9ca3af' },
            { min:15, max:19, nome:'Ouro', icon:'🥇', cor:'#f59e0b' },
            { min:20, max:24, nome:'Platina', icon:'🪨', cor:'#a855f7' },
            { min:25, max:29, nome:'Esmeralda', icon:'💚', cor:'#10b981' },
            { min:30, max:34, nome:'Rubi', icon:'❤️', cor:'#ef4444' },
            { min:35, max:39, nome:'Safira', icon:'💙', cor:'#3b82f6' },
            { min:40, max:44, nome:'Épico', icon:'👑', cor:'#fbbf24' },
            { min:45, max:49, nome:'Lendário', icon:'🌟', cor:'#ff8c00' },
            { min:50, max:54, nome:'Mítico', icon:'🔮', cor:'#ec4899' },
            { min:55, max:59, nome:'Celestial', icon:'🌌', cor:'#6366f1' },
            { min:60, max:64, nome:'Transcendente', icon:'⚡', cor:'#d946ef' },
            { min:65, max:69, nome:'Divino', icon:'🕊️', cor:'#e0e0e0' },
            { min:70, max:74, nome:'Supremo', icon:'💎', cor:'#38bdf8' },
            { min:75, max:79, nome:'Imortal', icon:'🔥', cor:'#f97316' },
            { min:80, max:84, nome:'Cósmico', icon:'🌠', cor:'#14b8a6' },
            { min:85, max:89, nome:'Abissal', icon:'🌊', cor:'#0ea5e9' },
            { min:90, max:94, nome:'Eterno', icon:'⏳', cor:'#eab308' },
            { min:95, max:99, nome:'Looto Master', icon:'🏆', cor:'#22c55e' }
        ];
        const niveis = [];
        for(const r of ranks) {
            for(let i = r.min; i <= r.max; i++) {
                const xpNecessario = Math.floor(100 * Math.pow(1.15, i));
                niveis.push({ nivel: i, nome: r.nome, icon: r.icon, cor: r.cor, xpNecessario });
            }
        }
        return niveis;
    }
    const NIVEIS_100 = gerarNiveis();
    
    function getNivelByXP(xp) {
        for(let i = NIVEIS_100.length - 1; i >= 0; i--) {
            if(xp >= NIVEIS_100[i].xpNecessario) return NIVEIS_100[i];
        }
        return NIVEIS_100[0];
    }
    
    const NIVEL_REQ_GS = { publico:0, prata:10, ouro:15, diamante:30, exclusivo:0 };
    const NIVEL_NOME_GS = { publico:'🌍 Público (Todos)', prata:'🥈 Prata+ (Nv 10+)', ouro:'🥇 Ouro+ (Nv 15+)', diamante:'💎 Diamante+ (Nv 30+)', exclusivo:'⭐ Exclusivo (Assinantes)' };
    const NIVEL_BADGE_GS = { publico:'badge-green', prata:'badge-gold', ouro:'badge-gold', diamante:'badge-diamond', exclusivo:'badge-pink' };
    
    function toast(msg, ok = false) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'toast show' + (ok ? ' ok' : '');
        clearTimeout(toast._t);
        toast._t = setTimeout(() => el.classList.remove('show'), 3000);
    }
    
    window.logout = async () => { await signOut(auth); window.location.href = 'login.html'; };
    
    async function checkAdmin(user) {
        if (!user) return false;
        if (user.email === 'startubez.com@gmail.com') return true;
        const snap = await get(ref(db, 'admins'));
        if (!snap.exists()) return false;
        const admins = snap.val();
        for (let key of Object.keys(admins)) { const a = admins[key]; if (a.uid === user.uid || a.email === user.email) return true; }
        return false;
    }
    
    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        const isAdmin = await checkAdmin(user);
        if (!isAdmin) {
            document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;flex-direction:column;gap:1rem;padding:2rem;"><h1 style="font-family:'Space Grotesk',sans-serif;font-size:3rem;color:#ef4444;">🚫 Acesso Negado</h1><p style="color:#9ca3af;">Você não tem permissão.</p><a href="looto.html" style="background:#6366f1;color:#fff;padding:.8rem 2rem;border-radius:8px;text-decoration:none;font-weight:600;">Ir para o Site</a></div>`;
            setTimeout(() => window.location.href = 'looto.html', 3000);
            return;
        }
        document.getElementById('admin-info').textContent = `👑 ${user.email}`;
        carregarGrandeSorteio();
    });
    
    async function carregarGrandeSorteio() {
        const snap = await get(ref(db, 'grandesorteio'));
        if (snap.exists()) {
            const d = snap.val();
            document.getElementById('gs-titulo').value = d.titulo || '';
            document.getElementById('gs-descricao').value = d.descricao || '';
            document.getElementById('gs-wallpaper').value = d.wallpaper || '';
            document.getElementById('gs-music-url').value = d.musicUrl || '';
            document.getElementById('gs-music-name').value = d.musicName || '';
            document.getElementById('gs-music-artist').value = d.musicArtist || '';
            document.getElementById('gs-music-platform').value = d.musicPlatform || 'spotify';
            document.getElementById('gs-music-icon').value = d.musicIconUrl || '';
            document.getElementById('gs-duracao').value = d.duracao || 72;
            document.getElementById('gs-max').value = d.maxParticipantes || 0;
            document.getElementById('gs-ativo').value = d.ativo ? 'true' : 'false';
            document.getElementById('gs-nivel').value = d.nivelAcesso || 'publico';
            document.getElementById('gs-redirect').value = d.redirectUrl || 'gsorteio.html';
            const kl = document.getElementById('key-list');
            kl.innerHTML = '';
            if (d.keys) d.keys.forEach(k => addKey(k.nome, k.key, k.plataforma));
            atualizarPreview();
        }
    }
    
    window.atualizarPreview = function() {
        const titulo = document.getElementById('gs-titulo').value || '🎮 Grande Sorteio Épico';
        const desc = document.getElementById('gs-descricao').value || 'Prepare-se para algo lendário!';
        const musicUrl = document.getElementById('gs-music-url').value;
        const musicName = document.getElementById('gs-music-name').value;
        const musicArtist = document.getElementById('gs-music-artist').value;
        const musicIconUrl = document.getElementById('gs-music-icon').value;
        const keys = document.querySelectorAll('.key-item').length;
        const ativo = document.getElementById('gs-ativo').value === 'true';
        const nivel = document.getElementById('gs-nivel').value;
        
        document.getElementById('gs-preview-title').textContent = titulo;
        document.getElementById('gs-preview-desc').textContent = desc;
        document.getElementById('gs-preview-keys-info').textContent = `🔑 ${keys} keys`;
        document.getElementById('gs-preview-status').textContent = ativo ? '🔴 AO VIVO' : '⏸️ Em Breve';
        document.getElementById('gs-preview-status').className = ativo ? 'badge badge-green' : 'badge badge-red';
        document.getElementById('gs-preview-nivel').textContent = NIVEL_NOME_GS[nivel] || '🌍 Público (Todos)';
        document.getElementById('gs-preview-nivel').className = 'badge ' + (NIVEL_BADGE_GS[nivel] || 'badge-green');
        
        const musicInfo = document.getElementById('gs-preview-music-info');
        const musicIcon = document.getElementById('gs-preview-music-icon');
        
        if (musicIconUrl) {
            musicIcon.src = musicIconUrl;
            musicIcon.style.display = 'block';
        } else {
            musicIcon.style.display = 'none';
        }
        
        if (musicUrl && musicName) {
            musicInfo.textContent = `🎵 ${musicName}${musicArtist ? ' - ' + musicArtist : ''}`;
            musicInfo.style.color = 'var(--green)';
        } else if (musicUrl) {
            musicInfo.textContent = '🎵 Música configurada (sem nome)';
            musicInfo.style.color = 'var(--primary)';
        } else {
            musicInfo.textContent = '🎵 Nenhuma música';
            musicInfo.style.color = 'var(--text-2)';
        }
        
        const musicBar = document.getElementById('gs-music-bar');
        const audio = document.getElementById('gs-music-audio');
        if (musicUrl) { musicBar.style.display = 'flex'; audio.src = musicUrl; }
        else { musicBar.style.display = 'none'; audio.pause(); }
        
        carregarParticipantesPreview();
    };
    
    async function carregarParticipantesPreview() {
        const snap = await get(ref(db, 'grandesorteio/participantes'));
        const container = document.getElementById('participants-preview');
        if (snap.exists()) {
            const parts = snap.val();
            const ids = Object.keys(parts);
            document.getElementById('gs-preview-parts-info').textContent = `👥 ${ids.length} participantes`;
            const avatars = ids.slice(0, 40).map(uid => {
                const p = parts[uid];
                return `<span class="participant-avatar" title="${p.nome || 'Anônimo'}">${(p.nome || '?')[0].toUpperCase()}</span>`;
            }).join('');
            container.innerHTML = `<h4>Participantes (${ids.length})</h4>${avatars}${ids.length > 40 ? `<span style="font-size:.7rem;color:var(--text-2);">+${ids.length-40} mais</span>` : ''}`;
        } else {
            document.getElementById('gs-preview-parts-info').textContent = '👥 0 participantes';
            container.innerHTML = '<h4>Participantes (0)</h4><span style="font-size:.7rem;color:var(--text-2);">Nenhum ainda</span>';
        }
    }
    
    window.pararMusica = function() { const audio = document.getElementById('gs-music-audio'); audio.pause(); audio.currentTime = 0; };
    
    window.addKey = function(nome = '', key = '', plat = 'Steam') {
        const d = document.createElement('div');
        d.className = 'key-item';
        d.innerHTML = `
            <input type="text" placeholder="Nome do Jogo" value="${nome}" class="kn" style="flex:2;">
            <input type="text" placeholder="XXXXX-XXXXX-XXXXX" value="${key}" class="kv" style="flex:2;">
            <select class="kp" style="flex:1;">
                <option ${plat==='Steam'?'selected':''}>Steam</option>
                <option ${plat==='Epic'?'selected':''}>Epic</option>
                <option ${plat==='GOG'?'selected':''}>GOG</option>
                <option ${plat==='Outro'?'selected':''}>Outro</option>
            </select>
            <button class="btn-sm red" onclick="this.parentElement.remove();atualizarPreview();">✕</button>`;
        document.getElementById('key-list').appendChild(d);
        atualizarPreview();
    };
    
    window.salvarGrandeSorteio = async () => {
        const keys = [];
        document.querySelectorAll('.key-item').forEach(i => {
            const n = i.querySelector('.kn').value.trim(), k = i.querySelector('.kv').value.trim(), p = i.querySelector('.kp').value;
            if (n && k) keys.push({ nome: n, key: k, plataforma: p });
        });
        await set(ref(db, 'grandesorteio'), {
            titulo: document.getElementById('gs-titulo').value,
            descricao: document.getElementById('gs-descricao').value,
            wallpaper: document.getElementById('gs-wallpaper').value,
            musicUrl: document.getElementById('gs-music-url').value,
            musicName: document.getElementById('gs-music-name').value,
            musicArtist: document.getElementById('gs-music-artist').value,
            musicPlatform: document.getElementById('gs-music-platform').value,
            musicIconUrl: document.getElementById('gs-music-icon').value,
            duracao: parseInt(document.getElementById('gs-duracao').value) || 72,
            maxParticipantes: parseInt(document.getElementById('gs-max').value) || 0,
            nivelAcesso: document.getElementById('gs-nivel').value,
            ativo: document.getElementById('gs-ativo').value === 'true',
            redirectUrl: document.getElementById('gs-redirect').value || 'gsorteio.html',
            keys, emBreve: true, participantes: {}
        });
        toast('Grande Sorteio salvo! ✅', true);
    };
    
    window.ativarGrandeSorteio = async () => {
        await update(ref(db, 'grandesorteio'), {
            ativo: true, emBreve: false,
            expiraEm: Date.now() + (parseInt(document.getElementById('gs-duracao').value) || 72) * 3600000
        });
        document.getElementById('gs-ativo').value = 'true';
        atualizarPreview();
        toast('🔴 Ativado!', true);
    };
    
    window.pausarGrandeSorteio = async () => {
        await update(ref(db, 'grandesorteio'), { ativo: false, emBreve: true });
        document.getElementById('gs-ativo').value = 'false';
        atualizarPreview();
        toast('⏸️ Pausado!', true);
    };
    
    window.sortearVencedor = async function() {
        const snap = await get(ref(db, 'grandesorteio'));
        if (!snap.exists()) { toast('Nenhum Grande Sorteio configurado!'); return; }
        const d = snap.val();
        const participantes = d.participantes || {};
        const pIds = Object.keys(participantes);
        if (pIds.length === 0) { toast('Nenhum participante!'); return; }
        if (!d.keys || d.keys.length === 0) { toast('Nenhuma key cadastrada!'); return; }
        if (d.keyEntregue) { toast('As keys já foram entregues!'); return; }
        if (!confirm(`🎲 Sortear entre ${pIds.length} participantes?`)) return;
        
        const vencedorId = pIds[Math.floor(Math.random() * pIds.length)];
        const vencedor = participantes[vencedorId];
        const keysSorteadas = [...d.keys];
        
        let recompensas = { gsVencedorXp: 2000, gsVencedorMoney: 500, gsParticipanteXp: 200, gsParticipanteMoney: 50 };
        const recSnap = await get(ref(db, 'configRecompensas'));
        if (recSnap.exists()) recompensas = recSnap.val();
        
        for (const keyData of keysSorteadas) {
            await push(ref(db, 'chat'), {
                uid: vencedorId, nome: vencedor.nome || 'Vencedor', texto: '',
                ts: Date.now(), type: 'treasure',
                keyCode: keyData.key, keyGame: keyData.nome || 'Grande Sorteio',
                keyPlatform: keyData.plataforma || 'Steam',
                sorteioId: 'grande-sorteio', opened: false
            });
        }
        
        await push(ref(db, 'chat'), {
            uid: 'bot', nome: 'LootoBot 🤖',
            texto: `🏆 <strong>${vencedor.nome || 'Alguém'}</strong> venceu o <strong>Grande Sorteio</strong>! 🎉`,
            ts: Date.now(), type: 'system'
        });
        
        await push(ref(db, 'chat'), {
            uid: vencedorId, nome: vencedor.nome || 'Vencedor',
            texto: `🏆 Você venceu o Grande Sorteio! Recebeu ${keysSorteadas.length} key(s)!`,
            ts: Date.now(), type: 'notification', notifType: 'win', notifTitle: '🏆 Vitória!',
            rewards: { xp: recompensas.gsVencedorXp || 2000, money: recompensas.gsVencedorMoney || 500 }
        });
        
        const vSnap = await get(ref(db, 'usuarios/' + vencedorId));
        const vData = vSnap.val() || {};
        const novoXpVencedor = (vData.pontos || 0) + (recompensas.gsVencedorXp || 2000);
        const novoNivelVencedor = getNivelByXP(novoXpVencedor).nivel;
        await update(ref(db, 'usuarios/' + vencedorId), {
            pontos: novoXpVencedor,
            dinheiro: (vData.dinheiro || 0) + (recompensas.gsVencedorMoney || 500),
            nivelConta: novoNivelVencedor
        });
        
        const updates = {};
        for (const pid of pIds) {
            if (pid === vencedorId) continue;
            const pSnap = await get(ref(db, 'usuarios/' + pid));
            const pData = pSnap.val() || {};
            const novoXp = (pData.pontos || 0) + (recompensas.gsParticipanteXp || 200);
            const novoNivel = getNivelByXP(novoXp).nivel;
            updates[`usuarios/${pid}/pontos`] = novoXp;
            updates[`usuarios/${pid}/dinheiro`] = (pData.dinheiro || 0) + (recompensas.gsParticipanteMoney || 50);
            updates[`usuarios/${pid}/nivelConta`] = novoNivel;
            
            await push(ref(db, 'chat'), {
                uid: pid, nome: participantes[pid]?.nome || 'Participante',
                texto: `😢 O vencedor foi <strong>${vencedor.nome || 'Alguém'}</strong>. Você ganhou pontos!`,
                ts: Date.now(), type: 'notification', notifType: 'lose', notifTitle: '😢 Não foi dessa vez',
                rewards: { xp: recompensas.gsParticipanteXp || 200, money: recompensas.gsParticipanteMoney || 50 }
            });
        }
        if (Object.keys(updates).length > 0) await update(ref(db), updates);
        
        await push(ref(db, 'logSorteios'), {
            data: Date.now(),
            jogo: 'Grande Sorteio: ' + keysSorteadas.map(k => k.nome).join(', '),
            key: keysSorteadas.map(k => k.key).join(' | '),
            criador: 'Admin', criadorId: 'admin',
            vencedor: vencedor.nome || 'Desconhecido', vencedorId: vencedorId,
            plataforma: keysSorteadas[0]?.plataforma || 'Várias',
            totalParticipantes: pIds.length, totalArrecadado: 0,
            status: 'Entregue', origem: 'grande-sorteio'
        });
        
        await push(ref(db, 'feed'), {
            html: `🏆 <strong>${vencedor.nome || 'Alguém'}</strong> venceu o <strong>Grande Sorteio</strong> e levou ${keysSorteadas.length} key(s)! 🎉`,
            ts: Date.now()
        });
        
        await update(ref(db, 'grandesorteio'), {
            ativo: false, emBreve: true, keyEntregue: true,
            vencedorId, vencedorNome: vencedor.nome, dataEntrega: Date.now()
        });
        
        document.getElementById('gs-ativo').value = 'false';
        atualizarPreview();
        toast(`🏆 ${vencedor.nome} venceu! Keys entregues e XP distribuído.`, true);
    };
    
    window.resetarGrandeSorteio = async () => {
        if (!confirm('Resetar participantes?')) return;
        await update(ref(db, 'grandesorteio'), { participantes: {} });
        atualizarPreview(); toast('Resetado!', true);
    };
    
    window.apagarGrandeSorteio = async () => {
        if (!confirm('🗑️ APAGAR TODO o Grande Sorteio?')) return;
        await remove(ref(db, 'grandesorteio'));
        ['gs-titulo','gs-descricao','gs-wallpaper','gs-music-url','gs-music-name','gs-music-artist','gs-music-icon','gs-redirect'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('gs-music-platform').value = 'spotify';
        document.getElementById('gs-duracao').value = '72';
        document.getElementById('gs-max').value = '0';
        document.getElementById('gs-ativo').value = 'false';
        document.getElementById('gs-nivel').value = 'publico';
        document.getElementById('key-list').innerHTML = '';
        pararMusica();
        document.getElementById('gs-music-bar').style.display = 'none';
        document.getElementById('gs-preview-music-icon').style.display = 'none';
        atualizarPreview();
        toast('Apagado! 🗑️', true);
    };
    
    if (!document.querySelector('.key-item')) addKey();
    carregarGrandeSorteio();
    </script>
</body>
</html>
